name: Secret scan (共通部品)

# プルリクエストと main への push で、API キーやトークンなどが混ざっていないかを gitleaks で調べる（Claude は使わない）。
# 見るのは今回増えたコミットだけ。見つかったら失敗にし、Summary に場所を出す（値そのものは伏せる）。
# 公開リポジトリでは一度入った秘密は取り消せないので、見つかったらキーを作り直すこと。
on:
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks を入れる（版とチェックサムを固定）
        env:
          V: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/g.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/g.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/g.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: 今回のコミットを調べる
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = pull_request ]; then range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then range="$BEFORE..$AFTER"
          else range="$AFTER~1..$AFTER"; fi
          echo "調べる範囲: $range"
          if "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/r.json" .; then
            echo "秘密情報は見つかりませんでした（$range）" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## 秘密情報らしきものが見つかりました"
              echo "キーやトークンなら、すぐに作り直してから消してください（公開リポジトリでは履歴に残ります）。"
              jq -r '.[] | "- `\(.File)` \(.StartLine) 行目（\(.RuleID)、コミット \(.Commit[0:7])）"' "$RUNNER_TEMP/r.json"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
