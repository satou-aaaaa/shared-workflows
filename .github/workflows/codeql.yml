name: CodeQL (共通部品)

# AI が書いたコードの脆弱性（XSS・入力の検査漏れなど）を CodeQL で調べる（Claude は使わない。公開リポジトリは無料）。
# 見つかったものは Security タブの Code scanning に出て、PR では注釈が付く。
# 考え方: AI が作ったプログラムの約4割に脆弱性があった（Pearce ほか「Asleep at the Keyboard?」IEEE S&P 2022 https://arxiv.org/abs/2108.09293 ）。
#   秘密の検査（gitleaks）とワークフローの検査（zizmor）では見つからない種類なので、別に調べる。
on:
  workflow_call:
    inputs:
      languages:
        description: '調べる言語（カンマ区切り）。例 "javascript-typescript,actions"、"python,actions"'
        type: string
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ inputs.languages }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
