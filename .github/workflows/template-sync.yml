name: Template sync
run-name: "Template sync"

# ひな形（template/）の共通部品を、全ゲームへ PR で配る（Claude は使わない）。
# 2026-11-17 satou さん「共通化をし、そこを修正する、というかたちに」→「共通部品を自動で配る」（incidents/2026-11-17-endless-revive-after-save-failure.md）。
# 各ゲームで node scripts/sync-template.mjs を回し、ちがいがあれば枝 template-sync に積んで PR を開く（あれば中身を入れ替える）。
# PR はゲームの QA と Secret scan が ✅ になると、ゲームの automerge.yml が自動でマージする。
# sw.js を変える PR はゲームの automerge が止める（hold_paths）ので、下の merge が3時間ごとに、検査が全部 ✅ のものをマージする
# （2026-11-22 satou さん「写す PR だけ自動マージ」。写す前に手元と公開の50本で QA を通して確かめ、QA は sw.js の SHELL も見る）。
# .github/ は写さない（鍵に Workflows の権限を持たせない。呼び出しの写しは今までどおり手で）。
# 鍵は環境「template-sync」の秘密 TEMPLATE_SYNC_TOKEN（fine-grained PAT。satou-aaaaa の全リポジトリ・Contents と Pull requests の書き込みだけ）。
# GITHUB_TOKEN では他のリポジトリへ書けず、GITHUB_TOKEN で開いた PR では QA も動かないため（GitHub Docs「Triggering a workflow from a workflow」）。
# 環境は main からしか使えないようにする（PR の枝のワークフローから鍵を読めない）。鍵が無いあいだは何もせずに知らせるだけ。
on:
  push:
    branches: [main]
    paths:
      - "template/**"
      - "!template/.github/**"
      - "scripts/sync-template.mjs"
  schedule:
    - cron: "40 22 * * 0" # 週1（日本時間の月曜 7:40）。配りそびれ・新作の拾い直し
    - cron: "17 */3 * * *" # 3時間ごと。検査の通った写す PR と「点検済み」の PR をマージするだけ（merge）
  workflow_dispatch:
    inputs:
      only:
        description: "このゲームだけ（空なら repos.txt の game 全部）"
        required: false
        type: string
        default: ""
      merge_only:
        description: "配らずに、検査の通った写す PR をマージするだけ"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: template-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '40 22 * * 0') || (github.event_name == 'workflow_dispatch' && !inputs.merge_only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: template-sync
    permissions:
      contents: read
      actions: write # 45分で切り上げたとき、残りのゲームだけでこのワークフローを起こし直す
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 各ゲームへ配る
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ONLY: ${{ inputs.only }}
          SHA: ${{ github.sha }}
          DISPATCH_TOKEN: ${{ github.token }}
          # 鍵が読めないときに、どこにずれがあるかを出す（値は出さず、あるか無いかだけ。2026-11-17 鍵が空で読まれた件）
          HAS_VAR: ${{ vars.TEMPLATE_SYNC_TOKEN != '' }}
          HAS_OTHER: >-
            TEMPLATE_SYNC=${{ secrets.TEMPLATE_SYNC != '' }}
            TEMPLATE_TOKEN=${{ secrets.TEMPLATE_TOKEN != '' }}
            SYNC_TOKEN=${{ secrets.SYNC_TOKEN != '' }}
            TEMPLATE_SYNC_PAT=${{ secrets.TEMPLATE_SYNC_PAT != '' }}
            GH_TOKEN=${{ secrets.GH_TOKEN != '' }}
            PAT=${{ secrets.PAT != '' }}
            TOKEN=${{ secrets.TOKEN != '' }}
            REPO_CREATE_TOKEN=${{ secrets.REPO_CREATE_TOKEN != '' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TEMPLATE_SYNC_TOKEN が空。同じ名前の変数（Variables）にある: $HAS_VAR。ほかの名前の秘密（true があればその名前で入っている）: $HAS_OTHER"
            echo "::warning::環境 template-sync に TEMPLATE_SYNC_TOKEN が無いので配らない（routines/game-dev.md「保存の読み直し」の配り方。手で配るときは shared-workflows のルートで sync-template.mjs をゲームのフォルダに向けて回す）"
            exit 0
          fi
          root=$PWD
          read -r -a games <<< "${ONLY:-$(node scripts/repos.mjs game)}"
          opened=0; failed=0; start=$SECONDS
          for i in "${!games[@]}"; do
            r=${games[$i]}
            # 時間切れでジョブごと止まらないよう、45分で切り上げ、残りのゲームだけでこのワークフローをすぐ起こし直す。
            # 前は「次の回が拾う」としていたが、3時間ごとの回はマージだけで配らず、残りは週1まで古いひな形のまま QA が落ちていた
            # （2026-11-23 teko-tsuriai から先の22本。tenji-yomi #17。incidents/2026-11-24-template-sync-leftovers-and-false-ok.md）
            if [ $((SECONDS - start)) -gt 2700 ]; then
              rest="${games[*]:$i}"
              echo "::warning::45分たったので $r から先（${#games[@]} 本中 $(( ${#games[@]} - i )) 本）は、起こし直した次の回で配る"
              # 待っている push の回（全部を配る）があれば、それが残りも配る。起こすと待っている回が取り消される（concurrency）ので起こさない
              if [ "$(GH_TOKEN="$DISPATCH_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/workflows/template-sync.yml/runs?status=queued&event=push" --jq '.total_count')" != 0 ]; then
                echo "::notice::待っている push の回が残りも配る"
              else
                GH_TOKEN="$DISPATCH_TOKEN" gh workflow run template-sync.yml -R "$GITHUB_REPOSITORY" --ref main -f only="$rest" || { echo "::error::残りを起こし直せなかった: $rest"; failed=1; }
              fi
              break
            fi
            if ! [[ "$r" =~ ^[a-z0-9-]+$ ]]; then echo "::error::名前の形でない: $r"; failed=1; continue; fi
            dir="$RUNNER_TEMP/$r"
            if ! git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/$r.git" "$dir"; then echo "::warning::$r を取れない"; failed=1; continue; fi
            # 新作を作っている途中（PR が開いたまま）のゲームの main にも配ってよい（写すのはひな形の範囲だけ）
            # 写す道具が止まったのを「ひな形どおり」と言わない（前は || true で隠れ、古いひな形の回が全部「ひな形どおり」と出ていた）
            scode=0; (cd "$dir" && node "$root/scripts/sync-template.mjs" . >/dev/null) || scode=$?
            if [ "$scode" = 3 ]; then
              # 3 = 手元のひな形が origin/main より古い（この回のあいだに main が進んだ）。最新のひな形に替えて、このゲームから続ける
              git -C "$root" fetch -q --depth=50 origin main && git -C "$root" checkout -q FETCH_HEAD -- template scripts && SHA=$(git -C "$root" rev-parse FETCH_HEAD)
              # HEAD は元のコミットのままなので、替えたあとは古さの見張りを外す（中身は FETCH_HEAD のひな形）
              export SYNC_ALLOW_STALE=1
              echo "::notice::ひな形が新しくなったので ${SHA:0:7} に替えて $r から続ける"
              scode=0; (cd "$dir" && node "$root/scripts/sync-template.mjs" . >/dev/null) || scode=$?
            fi
            if [ "$scode" != 0 ]; then echo "::warning::$r: 写す道具が止まった（終了 $scode）"; failed=1; rm -rf "$dir"; continue; fi
            git -C "$dir" checkout -q -- .github 2>/dev/null || true
            if [ -z "$(git -C "$dir" status --porcelain)" ]; then echo "✓ $r: ひな形どおり"; rm -rf "$dir"; continue; fi
            # 新しく足したファイル（transfer-qr.js など）も入れる。-a だけだと入らず、sw.js の SHELL が無いファイルを指した（2026-11-22 incidents/2026-11-22-template-sync-new-files-left-out.md）
            git -C "$dir" add -A
            git -C "$dir" -c user.name="template-sync" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit -qm "ひな形の共通部品を写す（shared-workflows ${SHA:0:7}）"
            # 1本で書けなくても残りは配る（鍵にそのリポジトリへの書き込みが無いときなど。2026-11-17 kokki-shuto で全体が止まった）
            if ! git -C "$dir" push -q -f origin HEAD:refs/heads/template-sync; then echo "::warning::$r に書けない（鍵の Contents の書き込み・対象のリポジトリを見る）。鍵から見えるこのリポジトリの権限: $(gh api "repos/$OWNER/$r" --jq '.permissions // "なし"' 2>&1 | tr -d '\n')"; failed=1; rm -rf "$dir"; continue; fi
            if [ -z "$(gh pr list -R "$OWNER/$r" --head template-sync --state open --json number --jq '.[].number')" ]; then
              body="shared-workflows の template/ を scripts/sync-template.mjs で写した（Template sync が自動で開いた PR）。中身は shared-workflows ${SHA:0:7} のひな形と同じ。QA が ✅ なら自動でマージされる。落ちたら shared-workflows のひな形を直す（ここの写しは直さない）。"
              gh pr create -R "$OWNER/$r" --head template-sync --base main --title "ひな形の共通部品を写す" --body "$body" >/dev/null && opened=$((opened+1)) || failed=1
            fi
            echo "→ $r: 配った"
            rm -rf "$dir"
            sleep 10 # 同時に多くの QA を走らせない
          done
          echo "新しく開いた PR: $opened"
          exit $failed

  # 写す PR（枝 template-sync・題「ひな形の共通部品を写す」・鍵の持ち主が開いたもの）と、
  # AI が開いて点検を終えた PR（枝 claude/…・ラベル「点検済み」・鍵の持ち主が開いたもの。2026-11-23 satou さん「自動マージの仕組みを入れても良い」）のうち、
  # 次を全部満たすものを squash でマージする。sw.js・data.js などでゲームの automerge が止める PR も、ここで拾う。
  #   下書きでない・ぶつかりが無い（clean）・.github/ を変えない・head のコミットの検査が全部終わって失敗が無く、QA が ✅
  #   ラベル「自動マージしない」は、ゲームの automerge が付けたもの（github-actions[bot]）だけなら外してマージする。人が付けたものは止める
  # 鍵（PAT）でマージするので、main への push でゲームの QA・Pages の公開がふつうに動く。
  merge:
    needs: sync
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: template-sync
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 検査の通った写す PR と点検済みの PR をマージする
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::TEMPLATE_SYNC_TOKEN が無いのでマージしない"; exit 0; fi
          me=$(gh api user --jq .login) || { echo "::warning::鍵の持ち主が読めない"; exit 0; }
          games=${ONLY:-$(node scripts/repos.mjs game)}
          merged=0; waiting=0; held=0
          for r in $games; do
            [[ "$r" =~ ^[a-z0-9-]+$ ]] || continue
            # 写す PR と、AI が「点検済み」を付けた PR（枝 claude/…）
            prs=$(gh api "repos/$OWNER/$r/pulls?state=open&per_page=100" --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | select(.head.ref == "template-sync" or ((.head.ref | startswith("claude/")) and any(.labels[]; .name == "点検済み"))) | .number' 2>/dev/null) || continue
            for pr in $prs; do
            info=$(gh api "repos/$OWNER/$r/pulls/$pr") || continue
            why=''
            [ "$(jq -r .user.login <<<"$info")" = "$me" ] || why='開いた人が鍵の持ち主でない'
            if [ "$(jq -r .head.ref <<<"$info")" = template-sync ]; then
              [ "$(jq -r .title <<<"$info")" = 'ひな形の共通部品を写す' ] || why="${why:-題がちがう}"
            fi
            [ "$(jq -r .draft <<<"$info")" = false ] || why="${why:-下書き}"
            st=$(jq -r .mergeable_state <<<"$info")
            # blocked（必須の検査が通っていない）は、下で検査を見てから理由を書く（QA の ❌ が「ぶつかり・待ち」に隠れていた。incidents/2026-11-27-template-comment-tripped-game-qa.md）
            if [ -z "$why" ] && [ "$st" != clean ] && [ "$st" != unstable ] && [ "$st" != blocked ]; then why="ぶつかり・待ち（$st）"; fi
            sha=$(jq -r .head.sha <<<"$info")
            if [ -z "$why" ] && gh api "repos/$OWNER/$r/pulls/$pr/files?per_page=100" --jq '.[].filename' | grep -q '^\.github/'; then why='.github/ を変える'; fi
            if [ -z "$why" ]; then
              runs=$(gh api "repos/$OWNER/$r/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | select(.app.slug != "coderabbitai")]')
              pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
              bad=$(jq -r '[.[] | select(.status == "completed" and (.conclusion | IN("success", "skipped", "neutral") | not)) | .name] | join(",")' <<<"$runs")
              qa=$(jq '[.[] | select((.name | test("(^|/ )qa$"; "i")) and .conclusion == "success")] | length' <<<"$runs")
              if [ "$pending" -gt 0 ]; then why='検査の途中'; waiting=$((waiting+1))
              elif [ -n "$bad" ]; then why="検査が落ちた（$bad）"
              elif [ "$qa" -eq 0 ]; then why='QA の ✅ が無い'
              elif [ "$st" = blocked ]; then why='ぶつかり・待ち（blocked）'; fi
            fi
            if [ -z "$why" ] && jq -e '.labels[].name | select(. == "自動マージしない")' <<<"$info" >/dev/null; then
              by=$(gh api "repos/$OWNER/$r/issues/$pr/events?per_page=100" --jq '[.[] | select(.event == "labeled" and .label.name == "自動マージしない") | .actor.login] | unique | join(",")')
              if [ "$by" = 'github-actions[bot]' ]; then gh api -X DELETE "repos/$OWNER/$r/issues/$pr/labels/$(jq -rn '"自動マージしない" | @uri')" >/dev/null || why='ラベルを外せない'
              else why="人がラベル「自動マージしない」を付けた（$by）"; fi
            fi
            if [ -n "$why" ]; then echo "… $r #$pr: $why"; held=$((held+1)); continue; fi
            if gh api -X PUT "repos/$OWNER/$r/pulls/$pr/merge" -f merge_method=squash -f sha="$sha" >/dev/null; then echo "✓ $r #$pr をマージした"; merged=$((merged+1))
            else echo "::warning::$r #$pr をマージできない"; fi
            sleep 3
            done
          done
          echo "マージ: $merged・止めた: $held（うち検査の途中 $waiting）" | tee -a "$GITHUB_STEP_SUMMARY"
