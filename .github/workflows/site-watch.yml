name: Site watch (共通部品)

# 公開中のページ（GitHub Pages）が開けるかを見る。paths に書いたファイルが 200 で返らなければ失敗にし、
# 呼び出し元の ci-failure-issue.yml がラベル ci-failure の Issue を立てる（次に成功すれば閉じる）。
# Claude は使わない。公開URLは Pages の設定から取るので、リポジトリ名やドメインが変わっても直さなくてよい。
on:
  workflow_call:
    inputs:
      paths:
        description: '公開URLからの相対パスを空白区切りで（トップページは常に見る）'
        type: string
        default: 'index.html'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 公開ページを開いてみる
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          # ==pages-begin==
          # 公開URLを Pages の設定から取る。404 だけが「Pages が切れている」。ほかの失敗（5xx・時間切れ・API の揺れ）は
          # 3回まで試し、それでも読めなければ github.io の決まった形の URL で見る（incidents/2026-11-28-site-watch-api-blip-as-pages-off.md）。
          # gh api は 404 でもエラーの本文を標準出力に出すので、|| true で受けると本文が URL になる（incidents/2026-11-01-pages-404-body-as-url.md）
          base=""; err=""
          for i in 1 2 3; do
            if out=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>"$RUNNER_TEMP/pages-err"); then
              case "$out" in https://*) base=$out; break ;; esac
              err="html_url が URL でない: $out"
            else
              err=$(cat "$RUNNER_TEMP/pages-err")
              case "$err" in *"HTTP 404"*) break ;; esac
            fi
            [ "$i" = 3 ] || sleep "${PAGES_RETRY_DELAY:-20}"
          done
          if [ -z "$base" ]; then
            case "$err" in
              *"HTTP 404"*)
                # 前は緑で終えていたので、Pages を入れ忘れたリポジトリが 404 のまま気づかれなかった（incidents/2026-11-04-pages-never-enabled.md）
                echo "::error title=Pages が有効になっていません::settings/pages → Deploy from a branch → main / (root)（公開しないリポジトリなら site-watch.yml を外す）"
                echo "Pages が有効になっていません（公開しないリポジトリなら site-watch.yml を外す）" >> "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
            esac
            owner=${GITHUB_REPOSITORY%%/*}; repo=${GITHUB_REPOSITORY#*/}
            owner=$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')
            base="https://${owner}.github.io/${repo}/"
            echo "::warning title=Pages の設定を読めませんでした（一時的な揺れの見込み）::${err:-（理由なし）}。決まった形の URL ${base} で見ます"
          fi
          # ==pages-end==
          base="${base%/}/"
          echo "公開URL: $base" | tee -a "$GITHUB_STEP_SUMMARY"
          bad=0
          # shellcheck disable=SC2086
          for f in "" $PATHS; do
            # 一時的な揺れで Issue が立たないよう、3回まで試す
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 20 --retry-all-errors \
              --max-time 30 "${base}${f}") || code=000
            if [ "$code" = 200 ]; then
              echo "- OK ${f:-（トップ）}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- NG ${f:-（トップ）}: HTTP $code" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=公開ページが開けません::${base}${f} が HTTP $code"
              bad=1
            fi
          done
          exit "$bad"
