name: Lint

# 共通部品とひな形のワークフローを actionlint で検査する。ここが壊れると全リポジトリの CI が止まるので、
# main に入れる前に必ず通す。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          curl -sSL -o al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf al.tgz actionlint
          ./actionlint -color .github/workflows/*.yml
          (cd template && ../actionlint -color .github/workflows/*.yml)

  # 立ち上げ直しの手順書（bootstrap/）に、ルーティンの手順書・共通部品の抜けや内部 ID の混入が無いかを調べる。
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bootstrap
        run: node scripts/check-bootstrap.mjs

  # ワークフローの安全性（なりすまし・資格情報の残り・危ないトリガーなど）を zizmor で調べる。
  # 決まりとして許しているもの（自分の部品を @main で呼ぶ など）は zizmor.yml に理由つきで書く。
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        run: pipx run zizmor==1.31.1 --offline --config zizmor.yml --min-severity medium .github/workflows template/.github/workflows

  # 手順書が routines/STYLE.md の形か、AGENTS.md（AI 共通の指示）があるかを調べる。
  # Claude が使えないときも、ほかの AI や人が同じ手順書で動けるようにするため。
  # あわせて、起きた問題の記録（incidents/）が直しただけで終わっていないか（防ぐ・見つける対策があるか）を調べる。
  routines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: routines
        run: |
          node scripts/check-routines.mjs
          node scripts/check-incidents.mjs
          node --check scripts/next-actions.mjs
