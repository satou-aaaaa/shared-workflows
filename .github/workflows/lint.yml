name: Lint

# 共通部品とひな形のワークフローを actionlint で検査する。ここが壊れると全リポジトリの CI が止まるので、
# main に入れる前に必ず通す。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # 手元と同じ準備の1コマンドで actionlint を入れる（版は scripts/setup.sh にだけ書く。準備の手順が古びたらここで気づく）
      - name: 準備（scripts/setup.sh）
        run: bash scripts/setup.sh
      # shellcheck も setup.sh が入れた版を使う（手元の scripts/check.sh と同じ版。機械に入っている版とずれて手元だけ通らないように）
      - name: actionlint
        run: |
          set -euo pipefail
          sc="$PWD/.tools/bin/shellcheck"
          .tools/bin/actionlint -color -shellcheck "$sc" .github/workflows/*.yml
          (cd template && ../.tools/bin/actionlint -color -shellcheck "$sc" .github/workflows/*.yml)
      # 各ゲームが写す引き継ぎコード（template/transfer.js）が読み戻せ、まちがったコードを弾くか（Node 22 の CompressionStream を使うので setup-node のあるこの job で）
      - name: 引き継ぎコードのひな形
        run: node scripts/check-transfer.mjs
      # 各ゲームが写す深さの部品（template/depth.js）の復習の間・自信の数え方・保存の失敗（routines/game-dev.md「1問を深くする」）
      - name: 深さの部品のひな形（自信をかける・復習）
        run: node template/qa/depth-check.mjs template/depth.js
      # ひな形の見張りの一覧（ci-failure-issue.yml）に、main で動くワークフローが全部あるか（incidents/2026-11-07-game-template-review-gaps.md）
      - name: ひな形の見張りの一覧
        run: node scripts/check-template-watch.mjs
      # sw.js の検査のひな形（template/qa/sw-check.mjs）が、本文の途中で止まって読み込み中のままになる書き方を見分けるか（incidents/2026-11-07-sw-body-stall.md）
      - name: sw.js の検査のひな形
        run: node scripts/check-sw-check.mjs
      # ヒント2で消した選び肢が戻る作り（hint:cut-moves）・読まれない星の表示（stars:role）を見分けるか（incidents/2026-11-07-hint-cut-comes-back.md）
      - name: ゲームの作りの見分け
        run: node scripts/check-game-patterns.mjs
      # Link check が読み違える URL の書き方（すぐ後ろに全角の字）を見分けるか（incidents/2026-11-08-link-check-wide-char-after-url.md）
      - name: リンクの書き方の見分け
        run: node scripts/check-link-text.mjs
      # 全リポジトリを読む定期のワークフローが、本数が増えても予算で止まって Issue を出す形か（incidents/2026-11-09-weekly-jobs-timeout.md）
      - name: 全リポジトリを読む検査の予算
        run: |
          node scripts/check-budgets.mjs
          node scripts/fit-body.mjs
      # 毎日の新作の回（routines/game-factory.md）が使う、作りかけ・候補の見分けと新作のひな形の写し方
      - name: 新作の作りかけの見分け
        run: node scripts/check-game-wip.mjs
      # 研究の毎日の回（routines/research-loop.md）が使う、今日の1件の選び方（一覧 docs/BACKLOG.md の読み方・日替わり・飛ばし方）
      - name: 研究の今日の1件の選び方
        run: node scripts/check-research-next.mjs

  # 立ち上げ直しの手順書（bootstrap/）に、ルーティンの手順書・共通部品の抜けや内部 ID の混入が無いかを調べる。
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bootstrap
        run: node scripts/check-bootstrap.mjs

  # ワークフローの安全性（なりすまし・資格情報の残り・危ないトリガーなど）を zizmor で調べる。
  # 決まりとして許しているもの（自分の部品を @main で呼ぶ など）は zizmor.yml に理由つきで書く。
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        run: pipx run zizmor==1.31.1 --offline --config zizmor.yml --min-severity medium .github/workflows template/.github/workflows

  # 手順書が routines/STYLE.md の形か、AGENTS.md（AI 共通の指示）があるかを調べる。
  # Claude が使えないときも、ほかの AI や人が同じ手順書で動けるようにするため。
  # あわせて、起きた問題の記録（incidents/）が直しただけで終わっていないか（防ぐ・見つける対策があるか）を調べる。
  routines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: routines
        run: |
          node scripts/check-routines.mjs
          node scripts/check-incidents.mjs
          node scripts/check-capture.mjs
          node scripts/check-repo-lists.mjs
          node scripts/check-issue-forms.mjs
          # Issue の重なりを見るのに検索（--search）を使わない。索引が遅れて、閉じた・作ったばかりの Issue を取りちがえる（incidents/2026-11-05-ci-time-report-missing-repos.md）
          if grep -rn 'gh issue list.*-[-]search' .github/workflows template/.github/workflows; then echo "✗ Issue の一覧で検索の索引を使わない（--json と --jq で題を見る）" >&2; exit 1; fi
          node --check scripts/next-actions.mjs
          node --check scripts/weekly-lists.mjs
      # ひな形の準備スクリプトが「準備できた」と言うとき本当に使えるか（壊れた依存・ブラウザ無し・nvm）を作り物の環境で確かめる
      - name: setup template
        run: bash scripts/check-setup-template.sh
