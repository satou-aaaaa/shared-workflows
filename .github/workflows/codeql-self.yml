name: CodeQL (template)

# ひな形（template/）の JavaScript を、全ゲームへ配る前にここで CodeQL にかける（Claude は使わない）。
# 調べるのはゲームに配る template/ と、core をゲームと同じ形で写した見本 scripts/fixtures/codeql/game.html（check-core が今の core と同じか見る）。
# core.js だけでは、ゲームの中で見つかる「# の名前で関数を呼ぶ」を見落とした。scripts/ のほかの道具はゲームに入らないので調べない。
# 2026-11-23 Core.screens の「# の名前で関数を呼ぶ」を、配ったあとのゲームの CodeQL が初めて見つけた
# （incidents/2026-11-23-template-codeql-after-sync.md）。配る前の PR で止める。
on:
  pull_request:
    paths:
      - "template/**"
      - "scripts/sync-template.mjs"
      - "scripts/fixtures/codeql/**"
      - ".github/workflows/codeql-self.yml"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - "template/**"
      - "scripts/sync-template.mjs"
      - "scripts/fixtures/codeql/**"

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      languages: javascript-typescript
      fail-on-alert: true
      config: |
        paths:
          - template
          - scripts/fixtures/codeql
