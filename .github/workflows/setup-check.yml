name: Setup check

# 各リポジトリの「準備の1コマンド」（scripts/setup.sh）が、まっさらな環境で最後まで通るかを確かめる（Claude は使わない）。
# README・AGENTS.md の準備の手順が古くなって、人やほかの AI が動かせなくなるのを防ぐ。
# 版は .nvmrc（Node.js）・.python-version（Python）から読む。ファイルが無い言語は入れない。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 版のファイルを探す
        id: v
        run: |
          if [ -f .nvmrc ]; then echo "node=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f .python-version ]; then echo "python=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: steps.v.outputs.python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: 準備の1コマンド
        run: bash scripts/setup.sh
