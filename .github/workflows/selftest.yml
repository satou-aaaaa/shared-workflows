name: Selftest

# 共通部品を、main に入れる前にこのリポジトリの中で実際に動かしてみる（Claude は使わない）。
# 各リポジトリは共通部品を @main で呼ぶので、壊れた部品がマージされると全リポジトリの CI が同時に止まる。
# Lint（書き方の検査）だけでは見つからない「動かすと壊れる」を、ここで先に見つける。
# - 書き込みをしない部品（秘密の検査）をそのまま呼ぶ
# - 公開後の確認のスクリプト（smoke.mjs）を、正常なページと存在しないページの両方に当て、結果の見分けが合っているかを見る
# - 画面の検査（ui-check.mjs）を、基準どおりの見本と、ボタンを足した・はみ出した見本に当てる
# - ページの分け方（U10〜U12）と画面の切り替え（Core.screens）を、分けた見本・ペライチの見本に当てる
# - 見やすさの検査（template/qa/a11y.mjs）のコントラストの測り方を、薄い字・濃い字の見本に当てる
# - 見やすさの設定のひな形（template/a11y/a11y.html）が、開いたあとの端末の設定の変更・保存の失敗のあとの変更を正しく扱うか
# 考え方: 全体に出す前に一部で試す（Google SRE Workbook「Canarying Releases」 https://sre.google/workbook/canarying-releases/ ）
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'template/**'

permissions:
  contents: read

jobs:
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  smoke-script:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: スクリプトの文法
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: 公開後の確認が「正常」と「壊れている」を見分けられるか
        run: |
          set -euo pipefail
          npm i --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
          export CHROME_PATH
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          base=https://satou-aaaaa.github.io/tenbin/
          okj=$(node scripts/smoke.mjs "$base" selftest)
          badj=$(node scripts/smoke.mjs "$base" selftest no-such-page-selftest.html)
          printf '%s\n%s\n' "$okj" "$badj"
          ok=$(jq -r .result <<<"$okj")
          bad=$(jq -r .result <<<"$badj")
          echo "正常なページ: $ok / 無いページ: $bad" | tee -a "$GITHUB_STEP_SUMMARY"
          # 正常なページは ok（Pages の障害で unreachable のときは見分けの検査ができないので通す）
          case "$ok" in ok|unreachable) ;; *) echo "::error::正常なページを $ok と判定しました"; exit 1 ;; esac
          # 無いページに Pages が 404 でなく 5xx を返す（unreachable）ときも、Pages 側の障害で見分けの検査ができないので、知らせて通す
          # （2026-11-11 無いページが2回続けて 503 になり、関係の無い PR が赤になった。incidents/2026-11-11-selftest-pages-503.md）
          badst=$(jq -r '.pages[] | select(.path == "no-such-page-selftest.html") | .status' <<<"$badj")
          if [ "$badst" = 0 ] || [ "${badst:-0}" -ge 500 ]; then echo "::warning::無いページが $badst（Pages の障害）。今回は見分けの検査ができない"; exit 0; fi
          if [ "$ok" = ok ] && [ "$bad" != broken ]; then echo "::error::無いページを $bad と判定しました（broken のはず）"; exit 1; fi

  game-props-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 性質テストが「正しい作り」と「壊れた作り」を見分けられるか
        env:
          FC_DIR: ${{ runner.temp }}/fc
        run: |
          set -uo pipefail
          npm i --no-save --no-audit --no-fund --prefix "$FC_DIR" fast-check@4.10.2 >/dev/null
          node scripts/game-props.mjs scripts/fixtures/props/good || { echo "::error::正しい作りを落とした"; exit 1; }
          if node scripts/game-props.mjs scripts/fixtures/props/bad; then echo "::error::壊れた作りを通した"; exit 1; fi
          echo "見分けられた"

  game-lint-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: ESLint が「正しい作り」と「書き間違い」を見分けられるか
        env:
          LINT_DIR: ${{ runner.temp }}/lint
        run: |
          set -uo pipefail
          npm i --no-save --no-audit --no-fund --prefix "$LINT_DIR" eslint@10.14.0 @eslint/js@10.0.1 globals@17.14.0 eslint-plugin-html@8.2.1 >/dev/null
          node scripts/game-lint.mjs scripts/fixtures/lint/good || { echo "::error::正しい作りを落とした"; exit 1; }
          if node scripts/game-lint.mjs scripts/fixtures/lint/bad; then echo "::error::書き間違い（GRET）を通した"; exit 1; fi
          node scripts/game-lint.mjs --warn scripts/fixtures/lint/bad || { echo "::error::--warn なのに失敗にした"; exit 1; }
          echo "見分けられた"

  ui-check-script:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 画面の検査が「基準どおり」と「悪くなった」を見分けられるか
        run: |
          set -euo pipefail
          npm i --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
          export CHROME_PATH
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          node scripts/ui-check.mjs scripts/fixtures/ui/config.json
          # 落ちたことだけでなく、基準違反（終了コード 1 と ::error::）で落ちたことを見る。スクリプトが壊れて落ちたのを「見分けた」と数えない
          rc=0
          out=$(node scripts/ui-check.mjs scripts/fixtures/ui/config-bad.json 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ] || ! grep -q '::error::' <<<"$out"; then echo "::error::ボタンを足した・はみ出した画面を基準違反として見分けられなかった（終了コード $rc）"; exit 1; fi
          echo "見分けられた" | tee -a "$GITHUB_STEP_SUMMARY"
      # ページの分け方（U10〜U12。routines/ui-rules.md）：画面を分けたページは測って落とす・前からあるペライチは知らせるだけ・"pages": "fail" なら落とす
      - name: 画面の検査がページの分け方（U10〜U12）を見分けられるか
        run: |
          set -euo pipefail
          export CHROME_PATH
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          node scripts/ui-check.mjs scripts/fixtures/ui/config-screens.json
          out=$(node scripts/ui-check.mjs scripts/fixtures/ui/config-long.json 2>&1)
          printf '%s\n' "$out"
          grep -q '::warning::ページを分けるとよい' <<<"$out" || { echo "::error::ペライチを知らせなかった"; exit 1; }
          for c in config-screens-bad config-long-fail; do
            rc=0
            out=$(node scripts/ui-check.mjs "scripts/fixtures/ui/$c.json" 2>&1) || rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 1 ] || ! grep -q 'U1[012]' <<<"$out"; then echo "::error::$c を U10〜U12 の違反として見分けられなかった（終了コード $rc）"; exit 1; fi
          done
          echo "見分けられた" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 画面の切り替え（Core.screens）の動き
        run: |
          set -euo pipefail
          export CHROME_PATH
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          node scripts/check-screens.mjs
      # ひな形の画面の検査（core-check）が、正しい画面で通り、壊した画面で落ちるか（incidents/2026-11-27-core-check-never-ran.md）
      - name: game-core の画面の検査（template/qa/core-check.mjs）の動き
        run: |
          set -euo pipefail
          export CHROME_PATH
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          node scripts/check-core-qa.mjs
      - name: 見やすさの検査（template/qa/a11y.mjs）がコントラストを甘く測らないか
        run: |
          set -euo pipefail
          export CHROME_PATH
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          node scripts/check-a11y-contrast.mjs
      # 見やすさの設定のひな形が、開いたあとの端末の設定の変更・保存の失敗のあとの変更を正しく扱うか（2026-11-17 hatsuden-kurabe #1・nenkin-shikumi #1 の CodeRabbit）
      - name: 見やすさの設定（template/a11y/a11y.html）の動き
        run: |
          set -euo pipefail
          export CHROME_PATH
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          node scripts/check-a11y-block.mjs
