name: Common check

# 全リポジトリ（repos.txt の game・app）を毎日見て、2つを Issue にまとめる（Claude は使わない）。
#   1. 共通部品の抜け：drift-check のうち「部品そのものが無い」行だけ（呼んでいない共通部品・無いファイル・一覧に無い公開リポジトリ・見やすさ・引き継ぎ）
#   2. 画面の決まりの違反：各リポジトリのホームを scripts/ui-check.mjs で測る（routines/ui-rules.md の U1〜U4）
# 直し方は routines/ui-rules.md と routines/onboarding.md。ずれてよい理由があれば scripts/drift-allow.json・各リポジトリの qa/ui-check.json の allow に理由を書く。
# きっかけ: 2026-11-23 新しく作ったアプリ（たべたメモ・川越の2本など）に共通の CI 部品が無く、kawagoe-bousai は一覧にも無かった。
# ずれの検査は週1（週次まとめ）だけで、作ってすぐの抜けを拾えなかった（incidents/2026-11-23-common-parts-missing-in-apps.md）。
on:
  schedule:
    - cron: "43 22 * * *" # 毎日 7:43 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: common-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 共通部品の抜けを見る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          REPOS=$(awk '!/^#/ && ($2 == "game" || $2 == "app") { print $1 }' repos.txt | tr '\n' ' ')
          {
            echo "毎日の点検（自動）。部品そのものが無い所だけを出す（古い版などのずれは週次まとめ）。直し方は routines/onboarding.md 手順2。"
            echo
            echo '```'
            GITHUB_TOKEN="$GH_TOKEN" REPOS="$REPOS" CLONE_ROOT="$RUNNER_TEMP/clones" BUDGET_SEC=900 API_MAX=800 \
              DRIFT_ONLY='共通部品 \S+ を呼んでいない|が無い（template/ から写す）|repos\.txt に無い|見やすさの設定が無い|qa/a11y\.mjs が無い|引き継ぎコード（transfer\.js）が無い|game-qa を呼んでいない' \
              node scripts/drift-check.mjs || echo "（確かめられなかった）"
            echo '```'
          } > "$RUNNER_TEMP/parts.md"
          cat "$RUNNER_TEMP/parts.md" >> "$GITHUB_STEP_SUMMARY"
      - name: 画面の決まりを見る
        run: |
          set -uo pipefail
          npm i --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
          export CHROME_PATH
          CHROME_PATH=$(command -v google-chrome || command -v chromium)
          out="$RUNNER_TEMP/ui.md"
          echo "毎日の点検（自動）。ホームをスマホ幅（390）とパソコン幅（1366）で測り、routines/ui-rules.md の決まりに外れた所を出す。" > "$out"
          echo >> "$out"
          found=0
          while read -r r; do
            d="$RUNNER_TEMP/clones/$r"
            [[ "$r" =~ ^[a-z0-9-]+$ ]] || continue
            [ -d "$d" ] || git clone -q --depth 1 "https://github.com/satou-aaaaa/$r.git" "$d" 2>/dev/null || continue
            [ -f "$d/index.html" ] || continue
            cfg=--default; [ -f "$d/qa/ui-check.json" ] && cfg=qa/ui-check.json
            # run: は bash -e。code=$? を後に書くと、外れたゲームを見つけた所で段ごと止まる（incidents/2026-11-24-common-check-exit-code-under-bash-e.md）
            code=0; log=$( cd "$d" && timeout 180 node "$GITHUB_WORKSPACE/scripts/ui-check.mjs" "$cfg" 2>&1 ) || code=$?
            if [ "$code" -ne 0 ]; then
              found=$((found + 1))
              { echo "## $r"; printf '%s\n' "$log" | grep -E '::error::' | sed 's/^::error::/- /' | head -6; [ "$code" -eq 1 ] || echo "- 検査が動かなかった（終了 $code）"; echo; } >> "$out"
            fi
          done < <(awk '!/^#/ && ($2 == "game" || $2 == "app") { print $1 }' repos.txt)
          [ "$found" -eq 0 ] && echo "決まりに外れた所はありません。" >> "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: Issue にまとめる（無くなったら閉じる）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          post() { # $1 題 $2 本文 $3 見つかったか（1/0）
            local open
            open=$(gh issue list -R "$GITHUB_REPOSITORY" --label 共通の点検 --state open --limit 20 --json number,title --jq ".[] | select(.title == \"$1\") | .number" | head -1)
            if [ "$3" = 1 ]; then
              node scripts/fit-body.mjs "$2"
              if [ -n "$open" ]; then gh issue edit "$open" -R "$GITHUB_REPOSITORY" --body-file "$2"; else gh issue create -R "$GITHUB_REPOSITORY" --label 共通の点検 --title "$1" --body-file "$2"; fi
            elif [ -n "$open" ]; then gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "今日の点検で無くなったので閉じます。"; fi
          }
          gh label create 共通の点検 --color 5319E7 --description "Common check が毎日まとめる（自動）" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          if grep -q '^\[' "$RUNNER_TEMP/parts.md"; then p=1; else p=0; fi
          if grep -q '^## ' "$RUNNER_TEMP/ui.md"; then u=1; else u=0; fi
          post "共通部品の抜け" "$RUNNER_TEMP/parts.md" "$p"
          post "画面の決まりの違反" "$RUNNER_TEMP/ui.md" "$u"
