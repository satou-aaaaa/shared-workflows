name: Auto merge (共通部品)

# 検査（呼び出し元の on.workflow_run.workflows に書いたもの）がプルリクエストで ✅ になったら、
# そのプルリクエストを自動で squash マージする。
# - 対象は、このリポジトリの中のブランチから出したプルリクエストだけ（よその人のフォークからのものは手でマージ）
# - 下書きのもの、ラベル「自動マージしない」が付いたもの、.github/ を変えるものはマージしない（手でマージ）
#   （.github/ を変える PR は GITHUB_TOKEN ではマージできない。workflows 権限が無いため）
# - require_paths を指定したときは、その正規表現に当てはまるファイルを1つも変えない PR もマージしない
# - 検査した時のコミットから新しいコミットが積まれていたら、マージしない（新しい方の検査を待つ）
# GITHUB_TOKEN でマージしたときは main への push で他のワークフローが動かないので、
# dispatch に書いたワークフローと Pages の公開をここから起こす。
on:
  workflow_call:
    inputs:
      require_paths:
        description: 'この正規表現（grep -E）に当てはまるファイルを変える PR だけマージする。空ならすべて'
        type: string
        default: ''
      dispatch:
        description: 'マージ後に main で起こすワークフローのファイル名（空白区切り）。例 "pages.yml release.yml"'
        type: string
        default: ''
      pages_build:
        description: 'マージ後に GitHub Pages の公開（ブランチから公開する設定のとき）を起こす'
        type: boolean
        default: false
      delete_branch:
        description: 'マージ後にブランチを消す'
        type: boolean
        default: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: automerge
      cancel-in-progress: false
    steps:
      - name: 検査の通ったプルリクエストをマージする
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REQUIRE_PATHS: ${{ inputs.require_paths }}
        run: |
          pr=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "開いているプルリクエストがありません"; exit 0; fi
          info=$(gh api "repos/$REPO/pulls/$pr")
          if [ "$(jq -r .draft <<<"$info")" = true ]; then echo "#$pr は下書きなのでマージしません"; exit 0; fi
          if jq -e '.labels[].name | select(. == "自動マージしない")' <<<"$info" >/dev/null; then echo "#$pr は「自動マージしない」"; exit 0; fi
          # 成績表（scorecard.yml）が「自動マージ停止」を出しているあいだはマージしない（壊れた割合が高い週）
          brake=$(gh api "repos/satou-aaaaa/shared-workflows/issues?labels=%E8%87%AA%E5%8B%95%E3%83%9E%E3%83%BC%E3%82%B8%E5%81%9C%E6%AD%A2&state=open" \
            --jq ".[] | select(.title == \"自動マージ停止: ${REPO#*/}\") | .html_url" 2>/dev/null | head -1 || true)
          if [ -n "$brake" ]; then echo "自動マージを止めている週なのでマージしません（$brake）"; exit 0; fi
          files=$(gh api --paginate "repos/$REPO/pulls/$pr/files" --jq '.[].filename')
          if echo "$files" | grep -q '^\.github/'; then echo "#$pr は .github/ を変えるので手でマージ"; exit 0; fi
          if [ -n "$REQUIRE_PATHS" ] && ! echo "$files" | grep -qE "$REQUIRE_PATHS"; then echo "#$pr は対象のファイルを変えないので手でマージ"; exit 0; fi
          if [ "$(jq -r .head.sha <<<"$info")" != "$SHA" ]; then echo "#$pr に新しいコミットがあるので、その検査を待ちます"; exit 0; fi
          gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=squash -f sha="$SHA" --jq .message
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - name: 公開などを起こす
        if: steps.merge.outputs.merged == 'true' && (inputs.dispatch != '' || inputs.pages_build)
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH: ${{ inputs.dispatch }}
          PAGES_BUILD: ${{ inputs.pages_build }}
        run: |
          for wf in $DISPATCH; do gh workflow run "$wf" -R "$GITHUB_REPOSITORY" --ref main; done
          if [ "$PAGES_BUILD" = true ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status || echo "::warning::公開を起こせませんでした（main への次の push で公開されます）"
          fi
      - name: 使い終わったブランチを消す
        if: steps.merge.outputs.merged == 'true' && inputs.delete_branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || true
