name: Auto merge (共通部品)

# 検査（呼び出し元の on.workflow_run.workflows に書いたもの）がプルリクエストで ✅ になったら、
# そのプルリクエストを自動で squash マージする。
# - 対象は、このリポジトリの中のブランチから出したプルリクエストだけ（よその人のフォークからのものは手でマージ）
# - 下書きのもの、ラベル「自動マージしない」が付いたもの、.github/ を変えるものはマージしない（手でマージ）
#   .github/ を変えるものには、ラベル「手でマージ」と一言を付けて、マージ待ちだと分かるようにする
#   （.github/ を変える PR は GITHUB_TOKEN ではマージできない。workflows 権限が無いため）
# - require_checks に書いた検査（check run の名前）が同じコミットで ✅ でなければマージしない（例: Secret scan の "scan / scan"）
# - require_paths を指定したときは、その正規表現に当てはまるファイルを1つも変えない PR もマージしない
# - hold_paths を指定したときは、その正規表現に当てはまるファイルを1つでも変える PR はマージせず、ラベル「自動マージしない」を付ける
#   （レビューを読んでから手でマージする決まりのファイル。ラベルを手で付ける前に自動マージされた。usotsuki-roppo #9、2026-11-01）
# - 検査した時のコミットから新しいコミットが積まれていたら、マージしない（新しい方の検査を待つ）
# - 成績表の「自動マージ停止」Issue が開いているとき、直近24時間に公開後の差し戻しが2回あったときもマージしない
# GITHUB_TOKEN でマージしたときは main への push で他のワークフローが動かないので、
# dispatch に書いたワークフローと Pages の公開をここから起こす。
# 同じ理由で main の検査（このマージのきっかけになった QA など）も main では動かず、
# 一度 main で赤になった「CI失敗」Issue が閉じなくなる（last-tell #71、2026-10-19）。
# そのため recheck_main（既定 true）で、きっかけの検査を main でもう一度起こす。
on:
  workflow_call:
    inputs:
      runner:
        description: 'どの機械で回すか（runs-on に渡す JSON）。例 ["self-hosted","lt-linux"]。既定は GitHub の機械。非公開リポジトリで無料枠を使い切ったとき、自前ランナーで回すため'
        type: string
        default: '"ubuntu-latest"'
      require_checks:
        description: '同じコミットで成功していなければマージしない check run の名前（改行区切り）。例 "scan / scan"'
        type: string
        default: ''
      require_paths:
        description: 'この正規表現（grep -E）に当てはまるファイルを変える PR だけマージする。空ならすべて'
        type: string
        default: ''
      hold_paths:
        description: 'この正規表現（grep -E）に当てはまるファイルを1つでも変える PR はマージせず、ラベル「自動マージしない」を付ける。空なら使わない'
        type: string
        default: ''
      dispatch:
        description: 'マージ後に main で起こすワークフローのファイル名（空白区切り）。例 "pages.yml release.yml"'
        type: string
        default: ''
      pages_build:
        description: 'マージ後に GitHub Pages の公開（ブランチから公開する設定のとき）を起こす'
        type: boolean
        default: false
      delete_branch:
        description: 'マージ後にブランチを消す'
        type: boolean
        default: false
      recheck_main:
        description: 'マージ後に、きっかけの検査（QA など）を main で回し直す（workflow_dispatch が要る）'
        type: boolean
        default: true

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    concurrency:
      group: automerge
      cancel-in-progress: false
    steps:
      - name: 検査の通ったプルリクエストをマージする
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REQUIRE_PATHS: ${{ inputs.require_paths }}
          HOLD_PATHS: ${{ inputs.hold_paths }}
          REQUIRE_CHECKS: ${{ inputs.require_checks }}
          WF_NAME: ${{ github.event.workflow_run.name }}
        run: |
          pr=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "開いているプルリクエストがありません"; exit 0; fi
          info=$(gh api "repos/$REPO/pulls/$pr")
          if [ "$(jq -r .draft <<<"$info")" = true ]; then echo "#$pr は下書きなのでマージしません"; exit 0; fi
          if jq -e '.labels[].name | select(. == "自動マージしない")' <<<"$info" >/dev/null; then echo "#$pr は「自動マージしない」"; exit 0; fi
          # 1ファイル1行の JSON 配列で取る（名前に改行があっても数えられる）。名前を変えたファイルは元の名前も判定に入れる
          names=$(gh api --paginate "repos/$REPO/pulls/$pr/files" --jq '.[] | [.filename, (.previous_filename // empty)] | @json')
          # 名前に改行があると行の判定がすり抜けるので、手でマージに回す
          if jq -se 'any(.[][]; test("\n"))' <<<"$names" >/dev/null; then echo "#$pr は名前に改行のあるファイルを変えるので、自動ではマージしません（手でマージ）"; exit 0; fi
          files=$(jq -r '.[]' <<<"$names")          # 変更前後の名前（.github/ と hold_paths は、止める側に倒すため両方を見る）
          new_files=$(jq -r '.[0]' <<<"$names")     # 変更後の名前だけ（require_paths は今までどおり）
          # ファイルの一覧は 3,000 件までしか返らない。全部を見られないと .github/ や hold_paths の判定がすり抜けるので、手でマージに回す
          if [ "$(grep -c . <<<"$names")" -lt "$(jq -r .changed_files <<<"$info")" ]; then echo "#$pr は変えたファイルを全部は見られないので、自動ではマージしません（手でマージ）"; exit 0; fi
          manual=''
          if printf '%s\n' "$files" | grep -q '^\.github/'; then manual=1; fi
          if [ -n "$HOLD_PATHS" ]; then
            # 正規表現が不正だと grep は 2 を返し「当てはまらない」と同じに見えるので、先に赤にする
            rc=0; printf '' | grep -qE -- "$HOLD_PATHS" || rc=$?
            if [ "$rc" -eq 2 ]; then echo "::error::hold_paths が正規表現として正しくありません: $HOLD_PATHS"; exit 1; fi
          fi
          if [ -n "$HOLD_PATHS" ] && printf '%s\n' "$files" | grep -qE -- "$HOLD_PATHS"; then
            echo "#$pr はレビューを読んでから手でマージするファイルを変えるので、自動ではマージしません"
            gh api -X POST "repos/$REPO/issues/$pr/labels" -f 'labels[]=自動マージしない' >/dev/null \
              || echo "::warning::#$pr にラベル「自動マージしない」を付けられませんでした（呼び出し側の permissions に pull-requests: write が要る）"
            exit 0
          fi
          if [ -z "$manual" ] && [ -n "$REQUIRE_PATHS" ] && ! printf '%s\n' "$new_files" | grep -qE -- "$REQUIRE_PATHS"; then echo "#$pr は対象のファイルを変えないので手でマージ"; exit 0; fi
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            st=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq "[.check_runs[] | select(.name == \"$c\")] | sort_by(.started_at) | last | (.conclusion // .status // \"なし\")")
            if [ "$st" != success ]; then echo "#$pr は「$c」が ${st:-なし} なのでマージしません（通ったら手でマージ）"; exit 0; fi
          done <<<"$REQUIRE_CHECKS"
          if [ "$(jq -r .head.sha <<<"$info")" != "$SHA" ]; then echo "#$pr に新しいコミットがあるので、その検査を待ちます"; exit 0; fi
          if [ -n "$manual" ]; then
            echo "#$pr は .github/ を変えるので手でマージ"
            # 黙って止まると、検査が緑のまま何日もマージされない（last-tell #150・carcassonne-research #69、2026-10-24）。
            # 今のコミットで必須の検査も通ったときだけ、ラベル「手でマージ」を付け、PR に一度だけ書く。監督の巡回がこのラベルで拾ってマージに回す。
            # 「自動マージ停止」のブレーキ中も付ける（人がマージを決めるため。ブレーキはこの下で自動マージだけを止める）
            if ! jq -e '.labels[].name | select(. == "手でマージ")' <<<"$info" >/dev/null; then
              # 先に一言を書き、通ったらラベルを付ける（一言だけ失敗しても、ラベルが無いので次の回でやり直せる）
              if gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="🔧 きっかけの検査（${WF_NAME:-QA}）は ✅ です。ほかの検査は PR の画面で確かめてください。.github/ を変えるので自動マージできません（GITHUB_TOKEN には workflows 権限が無い）。PR を出した担当が手でマージしてください。ラベル「手でマージ」で監督の巡回も拾います。" >/dev/null; then
                gh api -X POST "repos/$REPO/issues/$pr/labels" -f 'labels[]=手でマージ' >/dev/null \
                  || echo "::warning::#$pr にラベル「手でマージ」を付けられませんでした（呼び出し側の permissions に pull-requests: write が要る）"
              else
                echo "::warning::#$pr に一言を書けませんでした（呼び出し側の permissions に pull-requests: write が要る）"
              fi
            fi
            exit 0
          fi
          # 成績表（scorecard.yml）が「自動マージ停止」を出しているあいだはマージしない（壊れた割合が高い週）
          brake=$(gh api "repos/satou-aaaaa/shared-workflows/issues?labels=%E8%87%AA%E5%8B%95%E3%83%9E%E3%83%BC%E3%82%B8%E5%81%9C%E6%AD%A2&state=open" \
            --jq ".[] | select(.title == \"自動マージ停止: ${REPO#*/}\") | .html_url" 2>/dev/null | head -1 || true)
          if [ -n "$brake" ]; then echo "自動マージを止めている週なのでマージしません（$brake）"; exit 0; fi
          # すぐ効くブレーキ: 直近24時間に公開後の自動差し戻し（post-deploy.yml、題が「差し戻し:」）が2回あったらマージしない
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          reverts=$(gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=50" \
            --jq "[.[] | select(.merged_at != null and .merged_at >= \"$since\" and (.title | startswith(\"差し戻し:\")))] | length")
          if [ "${reverts:-0}" -ge 2 ]; then echo "直近24時間に差し戻しが ${reverts} 回あったので、自動ではマージしません（原因を直す PR は担当がマージする）"; exit 0; fi
          gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=squash -f sha="$SHA" --jq .message
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - name: 公開などを起こす
        if: steps.merge.outputs.merged == 'true' && (inputs.dispatch != '' || inputs.pages_build)
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH: ${{ inputs.dispatch }}
          PAGES_BUILD: ${{ inputs.pages_build }}
        run: |
          for wf in $DISPATCH; do
            if ! out=$(gh workflow run "$wf" -R "$GITHUB_REPOSITORY" --ref main 2>&1); then
              echo "$out"
              # 権限が無いと 403。warning だと誰も気づかないので赤にする（articles #4、2026-10-21）
              if grep -qiE '403|not accessible' <<<"$out"; then
                echo "::error::$wf を起こせませんでした。呼び出し側の permissions に actions: write を足す"
              else
                echo "::error::$wf を起こせませんでした（on: に workflow_dispatch があるか確かめる）"
              fi
              exit 1
            fi
          done
          if [ "$PAGES_BUILD" = true ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status || echo "::warning::公開を起こせませんでした（main への次の push で公開されます）"
          fi
      - name: main で検査を回し直す
        if: steps.merge.outputs.merged == 'true' && inputs.recheck_main
        env:
          GH_TOKEN: ${{ github.token }}
          WF_PATH: ${{ github.event.workflow_run.path }}
        run: |
          wf=$(basename "$WF_PATH")
          if ! out=$(gh workflow run "$wf" -R "$GITHUB_REPOSITORY" --ref main 2>&1); then
            echo "$out"
            # 権限が無いと 403。warning のままでは気づけなかった（local-kanban・naitei-no-michi、2026-10-21）
            if grep -qiE '403|not accessible' <<<"$out"; then
              echo "::error::$wf を main で起こせませんでした。呼び出し側の permissions に actions: write を足す"
              exit 1
            fi
            echo "::warning::$wf を main で起こせませんでした（on: に workflow_dispatch があるか確かめる）"
          fi
      - name: 使い終わったブランチを消す
        if: steps.merge.outputs.merged == 'true' && inputs.delete_branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || true
