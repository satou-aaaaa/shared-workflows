name: CI time report

# 毎週、satou-aaaaa の各リポジトリの CI の実行時間を集計し、このリポジトリの Issue 1件（ラベル「CI時間」）にする（Claude は使わない）。
# ルーティン「CI の時間短縮」（routines/ci-speedup.md）はこの Issue を読んで、どこを速くするかを決める。前の週の Issue は閉じる。
# kotlin-csv は他の人のものなので対象外。
on:
  schedule:
    # 毎週木曜 05:29 JST（= 水曜 20:29 UTC）
    - cron: "29 20 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# 公開リポジトリは全部見る（scripts/drift-check.mjs の REPOS ＋ shared-workflows）。リポジトリを足したらここにも足す。
# 2026-11-05 まで最初の6つだけで、11/1 からのゲーム15本が集計に入っていなかった。非公開（ops-backup など）は github.token で読めないので入れない。
env:
  REPOS: last-tell tenbin carcassonne-research sandbox local-kanban shared-workflows dungeon-boardgame naitei-no-michi articles usotsuki-roppo wagamama-burger kabu-news batsu-doko kasane-zome rosen-hitofude seiza-tsunagi mannaka-kanji kippu-10 bento-zume todofuken-relay shiritori-saitan madori-puzzle tenkizu-yomi bushu-tashizan amida-haitatsu kotoba-narabe jobun-tobatsu machi-michijun hikari-michi otsukai-memo bunshi-tsukuri kimari-sagashi okane-kihon kenko-minuki kondate-koma denki-kairo akushitsu-miyaburi dashisugi-check kikigaki-techo

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 集計して Issue にする
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          day=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          body="$RUNNER_TEMP/body.md"
          node scripts/ci-time.mjs > "$body"
          total=$(grep -oE '合計 \*\*[0-9.]+ 分' "$body" | grep -oE '[0-9.]+' | head -1)
          # GitHub の API が一時的に落ちることがある（2026-10-22 の回は GraphQL のエラーで落ちた）。Issue の操作は3回までやり直す
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::やり直し $i: $*" >&2; sleep $((i * 20)); done; return 1; }
          gh label create CI時間 --color 1D76DB --description "CI time report が作る週1の CI 実行時間（自動）" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          # 一覧が取れないまま「空」として進まない（$(...) の中の失敗は set -e で止まらない）
          # 同じ日の Issue は閉じない（閉じたあと検索の索引が遅れて「もうある」と見え、1件も無くなった。2026-11-05 incidents/2026-11-05-ci-time-report-missing-repos.md）
          olds=$(retry gh issue list -R "$GITHUB_REPOSITORY" --label CI時間 --state open --json number,title --jq ".[] | select(.title | startswith(\"CI時間 ${day}\") | not) | .number") || { echo "::error::CI時間の Issue の一覧が取れない" >&2; exit 1; }
          for old in $olds; do
            retry gh issue close "$old" -R "$GITHUB_REPOSITORY" --reason completed --comment "新しい集計を作ったので閉じます（自動）"
          done
          title="CI時間 ${day}（直近7日 ${total} 分）"
          # やり直しで同じ日の Issue が2件にならないよう、できていれば作らない
          # 一覧が取れないときは作らずに失敗を返す（取れないのを「無い」と見て二重に作らない）
          make() {
            local found
            # 検索（--search）は索引が遅れるので使わず、開いている一覧の題で見る
            found=$(gh issue list -R "$GITHUB_REPOSITORY" --label CI時間 --state open --json number,title --jq ".[] | select(.title | startswith(\"CI時間 ${day}\")) | .number") || return 1
            [ -n "$found" ] || gh issue create -R "$GITHUB_REPOSITORY" --label CI時間 --title "$title" --body-file "$body"
          }
          retry make
