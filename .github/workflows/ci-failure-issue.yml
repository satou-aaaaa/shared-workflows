name: CI failure issue (共通部品)

# 呼び出し元の既定ブランチ（main）でワークフローが失敗したら、ラベル ci-failure の Issue を1件立てる
# （同じワークフローの Issue が開いていればコメントを足す）。次に成功したら、その Issue を自動で閉じる。
# 監督エージェントが毎回 API で失敗を探す代わりに、この Issue を見るだけで済むようにするためのもの（Claude は使わない）。
#
# 呼び出し元（各リポジトリの .github/workflows/ci-failure-issue.yml）の書き方は template/ を見る。
# どのワークフローを見張るかは、呼び出し元の on.workflow_run.workflows に書く。
on:
  workflow_call:
    inputs:
      runner:
        description: 'どの機械で回すか（runs-on に渡す JSON）。例 ["self-hosted","lt-linux"]。既定は GitHub の機械。非公開リポジトリで無料枠を使い切ったとき、自前ランナーで回すため'
        type: string
        default: '"ubuntu-latest"'

jobs:
  report:
    # フォークの「main」という名前のブランチの PR を、このリポジトリの main と取り違えない
    if: >-
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["failure","success","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    concurrency:
      group: ci-failure-issue-${{ github.event.workflow_run.name }}
      cancel-in-progress: false
    steps:
      - name: Issue を立てる・閉じる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          title="CI失敗: ${WF_NAME}（main）"
          num=$(gh issue list --state open --label ci-failure --limit 50 --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)
          if [ "$CONCLUSION" = "success" ]; then
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "成功した実行が出たので閉じます: ${RUN_URL}"
            fi
            exit 0
          fi
          # 古いコミットの実行（再実行など）のときは、今の main を回すよう書き添える。
          # 再実行は同じコミットで回るので、もう直った失敗でも赤のままになる（last-tell #71、2026-10-19）
          head=$(gh api "repos/${GH_REPO}/commits/HEAD" --jq .sha 2>/dev/null || echo "")
          stale=""
          if [ -n "$head" ] && [ "$head" != "$SHA" ]; then
            stale="

          ⚠️ このコミットは今の main の先頭（${head:0:7}）ではありません。再実行は同じ古いコミットで回るので、直ったかどうかは今の main で回して確かめる（Actions の「Run workflow」で main を選ぶ）。"
          fi
          # この Issue を直す PR が開いたままなら書き添える。直す PR ができても、マージされずに失敗が続くことがある
          # （carcassonne-research #66・#69、2026-10-22〜24。.github/ を変える PR は自動マージが拾わない）
          waiting=""
          if [ -n "$num" ]; then
            # PR も issues の一覧に入る（issues: write だけで読める。呼び出し元に pull-requests の権限を足さなくてよい）
            prs=$(gh api "repos/${GH_REPO}/issues?state=open&per_page=100" --paginate \
              --jq ".[] | select(.pull_request != null) | select((.body // \"\") | test(\"(?i)\\\\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\\\\s+#${num}\\\\b\")) | \"#\\(.number)（最後の動き \\(.updated_at[:10])）\"" \
              2>/dev/null | paste -sd ' ' - || true)
            if [ -n "$prs" ]; then
              waiting="

          🔧 この Issue を直す PR ${prs} が開いたままです。新しく直すより先に、その PR を CI が緑ならマージする（赤なら直す）。"
            fi
          fi
          body="main で「${WF_NAME}」が ${CONCLUSION} になりました（きっかけ: ${EVENT}、コミット ${SHA:0:7}）。
          実行: ${RUN_URL}

          同じワークフローが次に成功すると、この Issue は自動で閉じます。${stale}${waiting}"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh label create ci-failure --color B60205 --description "main の CI 失敗（自動）" 2>/dev/null || true
            gh issue create --title "$title" --label ci-failure --body "$body"
          fi
