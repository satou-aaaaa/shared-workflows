name: CI failure issue (共通部品)

# 呼び出し元の既定ブランチ（main）でワークフローが失敗したら、ラベル ci-failure の Issue を1件立てる
# （同じワークフローの Issue が開いていればコメントを足す）。次に成功したら、その Issue を自動で閉じる。
# 監督エージェントが毎回 API で失敗を探す代わりに、この Issue を見るだけで済むようにするためのもの（Claude は使わない）。
#
# 呼び出し元（各リポジトリの .github/workflows/ci-failure-issue.yml）の書き方は template/ を見る。
# どのワークフローを見張るかは、呼び出し元の on.workflow_run.workflows に書く。
#
# 見回り（呼び出し元の schedule・workflow_dispatch で動いたとき）: 見張る名前ごとに main の最新の実行を見て、
# 同じように Issue を立てる・閉じる。GITHUB_TOKEN で起こした実行（自動マージが起こす Pages・selfplay が起こす AI content など）は
# workflow_run を起こさない（GitHub の仕様）ので、見回りが無いと失敗に気づけず、成功しても Issue が閉じない
# （carcassonne-research #83、2026-10-26〜28）。見張る名前は呼び出し元のファイルの workflows: の行から読む。
#
# 時間切れ: ジョブの timeout-minutes に当たった実行は、実行全体の結論が timed_out ではなく cancelled になる。
# cancelled の実行は、ジョブの注記（check run annotations）に「exceeded the maximum execution time」があれば
# timed_out として知らせる。手で止めた・concurrency で取り消された実行は今までどおり数えない
# （sandbox の Weekly mutation が4週続けて2時間で止まっていたのに Issue にならなかった、2026-10-28）。
# 注記は公開リポジトリなら権限なしで読める。非公開リポジトリは呼び出し元に checks: read が要る（無いと数えない・警告を出す）。
#
# 閉じない成功: 試しの実行（ジョブ名に「(dry run)」）・「（成功の印）」の手順が動かなかった実行（Auto merge がマージしなかったときなど）・
# 失敗したコミットより古いコミットの成功・ジョブを読めない実行。新しいコミットでもう成功していれば、古いコミットの失敗は知らせない。
on:
  workflow_call:
    inputs:
      runner:
        description: 'どの機械で回すか（runs-on に渡す JSON）。例 ["self-hosted","lt-linux"]。既定は GitHub の機械。非公開リポジトリで無料枠を使い切ったとき、自前ランナーで回すため'
        type: string
        default: '"ubuntu-latest"'

jobs:
  report:
    # フォークの「main」という名前のブランチの PR を、このリポジトリの main と取り違えない。
    # PR で動いた実行（CodeQL など）も main の結果として数えない（2026-11-07 CodeRabbit）
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.event, 'pull_request') &&
      contains(fromJSON('["failure","success","timed_out","cancelled"]'), github.event.workflow_run.conclusion))
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    concurrency:
      # cancelled の実行は別の組にする。同じ組で待てるのは1つだけなので、ただの cancelled が
      # 待っている失敗の知らせを押しのけないように（時間切れかどうかは中で調べる）
      group: ci-failure-issue-${{ github.event.workflow_run.name || 'sweep' }}${{ github.event.workflow_run.conclusion == 'cancelled' && format('-cancelled-{0}', github.event.workflow_run.id) || '' }}
      cancel-in-progress: false
    steps:
      - name: Issue を立てる・閉じる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          CALLER_REF: ${{ github.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # $( ) の中で || を使うと失敗時の本文も入る（incidents/2026-11-01-pages-404-body-as-url.md）
          head=$(gh api "repos/${GH_REPO}/commits/HEAD" --jq .sha 2>/dev/null) || head=""

          # cancelled の実行が、ジョブの時間切れ（timeout-minutes）で止まったものなら timed_out を、ほかは cancelled を出す
          timeout_or_cancelled() {
            local rid=$1 ids id hit=""
            if ! ids=$(gh api "repos/${GH_REPO}/actions/runs/${rid}/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "cancelled") | .id' 2>/dev/null); then
              echo "::warning title=時間切れか分かりません::実行 ${rid} のジョブを読めませんでした（actions: read が要る）" >&2
              echo cancelled; return 0
            fi
            for id in $ids; do
              if ! hit=$(gh api --paginate "repos/${GH_REPO}/check-runs/${id}/annotations?per_page=100" --jq '.[].message' 2>/dev/null); then
                echo "::warning title=時間切れか分かりません::ジョブ ${id} の注記を読めませんでした（非公開リポジトリは呼び出し元に checks: read が要る）" >&2
                hit=""; continue
              fi
              if grep -q "exceeded the maximum execution time" <<<"$hit"; then echo timed_out; return 0; fi
            done
            echo cancelled
          }

          # 1つのワークフローの1回の実行について、Issue を立てる・コメントする・閉じる
          report() {
            local wf=$1 conclusion=$2 url=$3 sha=$4 event=$5 rid=${6:-}
            local title="CI失敗: ${wf}（main）" num
            num=$(gh issue list --state open --label ci-failure --limit 50 --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)
            if [ "$conclusion" = "success" ]; then
              [ -n "$num" ] || return 0
              if [ -n "$rid" ]; then
                local jobs
                # ジョブを読めないときは閉じない（試しの実行か分からない。2026-11-07 kenko-minuki #5 の CodeRabbit）
                if ! jobs=$(gh api "repos/${GH_REPO}/actions/runs/${rid}/jobs?per_page=100" 2>/dev/null); then
                  echo "${wf}: 実行 ${rid} のジョブを読めないので、閉じずに次の成功を待つ"; return 0
                fi
                # 試しの実行（Branch cleanup の dry run など、ジョブ名に「(dry run)」）の成功では閉じない。本番と同じことをしていないため（2026-11-07 CodeRabbit）
                if jq -r '.jobs[].name' <<<"$jobs" | grep -qF '(dry run)'; then
                  echo "${wf}: 試しの実行の成功なので数えない"; return 0
                fi
                # 「（成功の印）」の手順があるワークフロー（Auto merge など）は、その手順が動いた成功だけを数える。
                # マージしないで終わった成功（下書きの PR など）で、マージの失敗の Issue を閉じない（kimari-sagashi #9 の CodeRabbit）
                if jq -e '[.jobs[].steps[]? | select(.name | contains("（成功の印）"))] | length > 0' <<<"$jobs" >/dev/null &&
                  ! jq -e '[.jobs[].steps[]? | select((.name | contains("（成功の印）")) and .conclusion == "success")] | length > 0' <<<"$jobs" >/dev/null; then
                  echo "${wf}: 本番の手順（成功の印）が動かなかった成功なので数えない"; return 0
                fi
              fi
              # 失敗したコミットより古いコミットの成功では閉じない（あとから終わった古い実行の成功で、新しい失敗を閉じていた。gurafu-minuki #5 の CodeRabbit）
              local failed rel
              failed=$(gh issue view "$num" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' 2>/dev/null | grep -oE 'コミット [0-9a-f]{7,40}' | tail -n1 | cut -d' ' -f2) || failed=""
              if [ -n "$failed" ] && rel=$(gh api "repos/${GH_REPO}/compare/${failed}...${sha}" --jq .status 2>/dev/null) && [ "$rel" = behind ]; then
                echo "${wf}: 失敗したコミット ${failed} より古いコミットの成功なので閉じない"; return 0
              fi
              gh issue close "$num" --comment "成功した実行が出たので閉じます: ${url}"
              return 0
            fi
            # 新しいコミットでもう成功しているなら、あとから終わった古いコミットの失敗は知らせない（akushitsu-miyaburi #4 の CodeRabbit）
            if [ -n "$head" ] && [ "$head" != "$sha" ]; then
              local ok_sha rel2
              ok_sha=$(gh run list --workflow "$wf" --branch "$DEFAULT_BRANCH" --status success --limit 20 --json headSha,event \
                --jq '[.[] | select(.event | startswith("pull_request") | not)][0].headSha // empty' 2>/dev/null) || ok_sha=""
              if [ -n "$ok_sha" ] && [ "$ok_sha" != "$sha" ] && rel2=$(gh api "repos/${GH_REPO}/compare/${sha}...${ok_sha}" --jq .status 2>/dev/null) && [ "$rel2" = ahead ]; then
                echo "${wf}: 新しいコミット ${ok_sha:0:7} でもう成功しているので、古いコミット ${sha:0:7} の失敗は知らせない"; return 0
              fi
            fi
            # 同じ実行を2回知らせない（見回りと workflow_run の両方が同じ失敗を見ることがある）
            if [ -n "$num" ] && gh issue view "$num" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' | grep -qF "$url"; then
              echo "${wf}: この失敗はもう知らせてある（#${num}）"
              return 0
            fi
            # 古いコミットの実行（再実行など）のときは、今の main を回すよう書き添える。
            # 再実行は同じコミットで回るので、もう直った失敗でも赤のままになる（last-tell #71、2026-10-19）
            local stale=""
            if [ -n "$head" ] && [ "$head" != "$sha" ]; then
              stale="

          ⚠️ このコミットは今の main の先頭（${head:0:7}）ではありません。再実行は同じ古いコミットで回るので、直ったかどうかは今の main で回して確かめる（Actions の「Run workflow」で main を選ぶ）。"
            fi
            # この Issue を直す PR が開いたままなら書き添える。直す PR ができても、マージされずに失敗が続くことがある
            # （carcassonne-research #66・#69、2026-10-22〜24。.github/ を変える PR は自動マージが拾わない）
            local waiting="" prs
            if [ -n "$num" ]; then
              # PR も issues の一覧に入る（issues: write だけで読める。呼び出し元に pull-requests の権限を足さなくてよい）
              prs=$(gh api "repos/${GH_REPO}/issues?state=open&per_page=100" --paginate \
                --jq ".[] | select(.pull_request != null) | select((.body // \"\") | test(\"(?i)\\\\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\\\\s*:?\\\\s*#${num}\\\\b\")) | \"#\\(.number)（最後の動き \\(.updated_at[:10])）\"" \
                2>/dev/null | paste -sd ' ' - || true)
              if [ -n "$prs" ]; then
                waiting="

          🔧 この Issue を直す PR ${prs} が開いたままです。新しく直すより先に、その PR を CI が緑ならマージする（赤なら直す）。"
              fi
            fi
            local body="main で「${wf}」が ${conclusion} になりました（きっかけ: ${event}、コミット ${sha:0:7}）。
          実行: ${url}

          同じワークフローが次に成功すると、この Issue は自動で閉じます。${stale}${waiting}"
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "$body"
            else
              gh label create ci-failure --color B60205 --description "main の CI 失敗（自動）" 2>/dev/null || true
              gh issue create --title "$title" --label ci-failure --body "$body"
            fi
          }

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            c=$RUN_CONCLUSION
            if [ "$c" = "cancelled" ]; then c=$(timeout_or_cancelled "$RUN_ID"); fi
            if [ "$c" = "cancelled" ]; then echo "${WF_NAME}: cancelled（時間切れではないので数えない）"; exit 0; fi
            report "$WF_NAME" "$c" "$RUN_URL" "$SHA" "$RUN_EVENT" "$RUN_ID"
            exit 0
          fi

          # 見回り: 呼び出し元のファイル（例 .github/workflows/ci-failure-issue.yml）の workflows: ["A", "B"] を読む
          path=${CALLER_REF#"${GH_REPO}/"}; path=${path%@*}
          names=$(gh api "repos/${GH_REPO}/contents/${path}?ref=${DEFAULT_BRANCH}" -H "Accept: application/vnd.github.raw" |
            python3 -c 'import json,re,sys; m=re.search(r"^\s*workflows:\s*(\[.*\])\s*$", sys.stdin.read(), re.M); print("\n".join(json.loads(m.group(1))) if m else "")')
          if [ -z "$names" ]; then
            echo "::error title=見張る名前を読めませんでした::${path} に workflows: [\"名前\", …] の行（1行で書く）が要ります"
            exit 1
          fi
          while IFS= read -r wf; do
            # PR で動いた実行は飛ばす（main の結果ではない）
            run=$(gh run list --workflow "$wf" --branch "$DEFAULT_BRANCH" --status completed --limit 20 \
              --json conclusion,url,headSha,event,databaseId --jq '[.[] | select(.event | startswith("pull_request") | not)][0] // empty | [.conclusion, .url, .headSha, .event, .databaseId] | @tsv' 2>/dev/null) || run=""
            if [ -z "$run" ]; then echo "${wf}: main の実行が無い"; continue; fi
            IFS=$'\t' read -r c u s e id <<<"$run"
            if [ "$c" = "cancelled" ]; then c=$(timeout_or_cancelled "$id"); fi
            case "$c" in
              failure|success|timed_out) echo "${wf}: ${c}"; report "$wf" "$c" "$u" "$s" "$e" "$id" ;;
              *) echo "${wf}: ${c}（数えない）" ;;
            esac
          done <<<"$names"
