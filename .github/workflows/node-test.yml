name: Node test (共通部品)

# ブラウザの要らない Node.js のリポジトリ（言語の処理系・道具など）の検査（Claude は使わない）。
# game-qa.yml は Playwright を入れるので、ブラウザを使わないリポジトリには重い（入れるだけで1〜9分）。こちらは Node を入れてコマンドを回すだけ。
# 検査の名前は呼び出し側のジョブ名 qa と合わせて「qa / qa」になる（Create repo が入れる main の必須チェックと同じ名前）。
# 依存は package-lock.json があるときだけ npm ci で入れる（標準ライブラリだけのリポジトリは何も入れない）。
on:
  workflow_call:
    inputs:
      command:
        description: '検査のコマンド（空白区切りの1つのコマンド。シェルの式は通さない）'
        type: string
        default: npm test
      timeout:
        description: '時間切れ（分）'
        type: number
        default: 10

permissions:
  contents: read

jobs:
  qa:
    name: qa
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # 保守の終わった Node は使わない（脆弱性が見つかっても直らないため）。予定表は Node.js 公式（nodejs/Release の schedule.json）
      - name: Node の版がまだ保守されているか
        run: |
          set -euo pipefail
          major=$(node -p 'process.versions.node.split(".")[0]')
          end=$(curl -fsSL --retry 3 https://raw.githubusercontent.com/nodejs/Release/main/schedule.json | jq -r --arg v "v$major" '.[$v].end // empty')
          if [ -z "$end" ]; then echo "::error::Node $major は保守の予定表にない"; exit 1; fi
          if [[ "$end" < "$(date -u +%F)" ]]; then echo "::error::Node $major の保守は $end に終わった。.nvmrc を保守中の版に上げる"; exit 1; fi
          echo "Node $(node -v)（保守は $end まで）"
      - name: 依存を入れる（package-lock.json があるときだけ）
        if: hashFiles('package-lock.json') != ''
        run: npm ci --no-audit --no-fund
      # 既知の脆弱性がある依存は使わない（低いものでも止める）。npm audit は GitHub Advisory Database を見る
      - name: 依存の脆弱性（package-lock.json があるときだけ）
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=low
      - name: 検査
        env:
          QA_COMMAND: ${{ inputs.command }}
        run: |
          read -r -a cmd <<< "$QA_COMMAND"
          "${cmd[@]}"
