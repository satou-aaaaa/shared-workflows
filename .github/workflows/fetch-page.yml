name: Fetch page

# クラウドのセッションから開けないページ（e-Gov など、クラウドの IP を拒むサイト）を、GitHub Actions から読む（Claude は使わない）。
# エージェントは workflow_dispatch で url を渡して起こし、ジョブのログ（本文の先頭）か成果物「page」（全文）を読む。
# 読めるのは下の ALLOWED_HOSTS に当たる https のページだけ（何でも読める踏み台にしないため）。足すときは理由を1行添える。
# 使い方は routines/known-limits.md。
on:
  workflow_dispatch:
    inputs:
      url:
        description: "読む https の URL（ALLOWED_HOSTS のどれかに当たるもの）"
        required: true
        type: string

permissions:
  contents: read

env:
  # laws.e-gov.go.jp: クラウドから 403（2026-10-21）。go.jp: 官公庁の公式情報（法令の根拠を確かめる）。docs.github.com: クラウドから名前を引けない（2026-10-22）
  ALLOWED_HOSTS: "laws.e-gov.go.jp .go.jp docs.github.com"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: URL を確かめて読む
        env:
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, urllib.parse
          u = urllib.parse.urlsplit(os.environ["URL"])
          host = (u.hostname or "").lower()
          ok = u.scheme == "https" and any(host == a or (a.startswith(".") and host.endswith(a)) for a in os.environ["ALLOWED_HOSTS"].split())
          if not ok:
              print(f"::error::読めるのは https で ALLOWED_HOSTS に当たるページだけです: {host or '(なし)'}")
              sys.exit(1)
          PY
          mkdir -p page
          code=$(curl -sS -L --max-time 60 --max-filesize 5000000 -A "Mozilla/5.0 (fetch-page; satou-aaaaa/shared-workflows)" -o page/raw -w '%{http_code}' -- "$URL")
          echo "HTTP $code"
          python3 - <<'PY'
          import html, re
          raw = open("page/raw", "rb").read().decode("utf-8", "replace")
          text = re.sub(r"(?is)<(script|style)\b.*?</\1>", "", raw)
          text = re.sub(r"(?i)<br\s*/?>|</(p|div|li|tr|h[1-6])>", "\n", text)
          text = html.unescape(re.sub(r"<[^>]+>", "", text))
          text = "\n".join(l.strip() for l in text.splitlines() if l.strip())
          open("page/text.txt", "w").write(text)
          print("----- 本文（先頭 20000 字。全文は成果物 page の text.txt）-----")
          print(text[:20000])
          PY
          [ "$code" -lt 400 ] || { echo "::error::HTTP $code"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: page
          path: page/
          retention-days: 3
