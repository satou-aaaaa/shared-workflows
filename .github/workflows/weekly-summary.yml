name: Weekly summary

# 毎週月曜の朝、satou-aaaaa の各リポジトリの「開いたままのPR・CI失敗Issue・Dependabot の更新待ち」を
# このリポジトリの Issue 1件にまとめる（Claude は使わない）。前の週のまとめは閉じる。
# 監督・巡回のルーティンは、リポジトリを1つずつ見に行く代わりにこの Issue を読む（Claude の利用枠の節約）。
on:
  schedule:
    # 毎週月曜 06:17 JST（= 日曜 21:17 UTC）
    - cron: "17 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  summary:
    runs-on: ubuntu-latest
    # 中の node は BUDGET_SEC（ジョブの上限より短い）で読むのをやめ、読めなかった分を本文に書く。Issue は必ず出す。
    # 予算の6割を超えたら本文と注記に ⏱ を出す（2026-11-09 リポジトリ88本で5分の時間切れ。incidents/2026-11-09-weekly-jobs-timeout.md）
    timeout-minutes: 15
    steps:
      # 「次にやること」（scripts/next-actions.mjs）を一緒に載せるため。Claude が止まっていても、この Issue のメールで次の一手が分かる
      # incidents/ は再発防止の点検（残っている対策・同じ種類の繰り返し）に使う
      # .github/workflows は、ひな形のずれの検査（drift-check.mjs）が「もう無い部品を呼んでいないか」を見るのに使う
      # template は、drift-check.mjs がひな形（setup.sh・transfer.js・sw.js・a11y など）と写しを比べるのに使う（無いと検査の前に止まっていた。2026-11-07 #252 の CodeRabbit）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            incidents
            .github/workflows
            template
      - name: まとめを作って Issue にする
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # 見るリポジトリは repos.txt（ここに一覧を書かない。incidents/2026-11-07-repo-list-conflicts.md）
          REPOS="$(node scripts/repos.mjs) shared-workflows"
          export REPOS
          now=$(date -u +%s)
          day=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          body="$RUNNER_TEMP/body.md"
          {
            echo "${day} 時点（自動）。各リポジトリの開いたままの PR（古い順）と、ラベル ci-failure の Issue です。"
            echo
          } > "$body"
          # 開いた PR と ci-failure の Issue は検索でまとめて読む（1本ずつ2回読むと88本で176回。2026-11-09 時間切れ）
          lists="$RUNNER_TEMP/lists.json"
          BUDGET_SEC=60 node scripts/weekly-lists.mjs > "$lists"
          total=0
          for r in $REPOS; do
            prs=$(jq -r --arg r "$r" '.prs | map(select(.repo == $r)) | sort_by(.created_at) | .[] | "\(.number)\t\(.draft)\t\(.user)\t\(.created_at)\t\(.title)"' "$lists")
            fails=$(jq -r --arg r "$r" '.fails | map(select(.repo == $r)) | .[] | "\(.number)\t\(.title)"' "$lists")
            if [ -z "$prs" ] && [ -z "$fails" ]; then echo "- **$r**: 何もありません" >> "$body"; continue; fi
            echo "### $r" >> "$body"
            while IFS=$'\t' read -r n draft user created title; do
              [ -n "$n" ] || continue
              age=$(( (now - $(date -u -d "$created" +%s)) / 86400 ))
              tag=""; [ "$draft" = true ] && tag="（下書き）"
              [ "$user" = "dependabot[bot]" ] && tag="${tag}（Dependabot）"
              echo "- PR [#$n](https://github.com/$OWNER/$r/pull/$n) ${title}${tag} — ${age}日前" >> "$body"
              total=$((total+1))
            done <<< "$prs"
            while IFS=$'\t' read -r n title; do
              [ -n "$n" ] || continue
              echo "- ❌ [#$n](https://github.com/$OWNER/$r/issues/$n) ${title}" >> "$body"
              total=$((total+1))
            done <<< "$fails"
            echo >> "$body"
          done
          {
            jq -r '.errors[] | "（確かめられなかった: \(.)）"' "$lists"
            echo "### 次にやること（急ぐ順。Claude が止まっているときは routines/without-claude.md の B の表で対応する）"
            echo
            echo '```'
            GITHUB_TOKEN="$GH_TOKEN" REPOS="$REPOS" BUDGET_SEC=180 node scripts/next-actions.mjs || echo "（次にやることを出せなかった）"
            echo '```'
          } >> "$body"
          {
            echo
            echo "### ひな形からのずれ（各リポジトリで直す PR を作るか、ずれてよい理由を scripts/drift-allow.json に書く）"
            echo
            echo '```'
            GITHUB_TOKEN="$GH_TOKEN" REPOS="$REPOS" CLONE_ROOT="$RUNNER_TEMP/clones" BUDGET_SEC=420 API_MAX=600 node scripts/drift-check.mjs || echo "（ずれを確かめられなかった）"
            echo '```'
          } >> "$body"
          gh label create 週次まとめ --color 0E8A16 --description "Weekly summary が作る週1のまとめ（自動）" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          for old in $(gh issue list -R "$GITHUB_REPOSITORY" --label 週次まとめ --state open --json number --jq '.[].number'); do
            gh issue close "$old" -R "$GITHUB_REPOSITORY" --reason completed --comment "新しいまとめを作ったので閉じます（自動）"
          done
          gh issue create -R "$GITHUB_REPOSITORY" --label 週次まとめ --title "週次まとめ ${day}（気にするもの ${total} 件）" --body-file "$body"
