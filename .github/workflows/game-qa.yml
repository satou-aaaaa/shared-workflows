name: Game QA (共通部品)

# ゲームの QA：ブラウザで自動で遊んで確かめる（Claude は使わない）。各ゲームの .github/workflows/qa.yml が @main で呼ぶ。
# 前は各ゲームが手順を写していて、版の固定（SHA）や時間切れの直しが届かないゲームが出た（incidents/2026-11-07-game-template-review-gaps.md）。
# 検査の名前（check run）は「呼ぶ側のジョブ名 / qa」。ひな形では qa / qa（Auto merge の require_checks とルールセットの必須チェックに書く）。
# 落ちたら成果物の qa-report/report.md を見る。手元では node qa/run.mjs で同じものが回る。
on:
  workflow_call:
    inputs:
      npm_dir:
        description: 'package-lock.json のあるフォルダ'
        type: string
        default: qa
      command:
        description: '検査のコマンド（空白区切りの1つのコマンド）'
        type: string
        default: node qa/run.mjs
      timeout:
        description: '時間切れ（分）。Playwright を入れる段階だけで9分かかる日がある（incidents/2026-11-05-qa-timeout-slow-install.md）'
        type: number
        default: 20

permissions:
  contents: read

jobs:
  qa:
    name: qa
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ inputs.npm_dir }}/package-lock.json
      # PR で足した写し（新作の PR #1 は全部）と、直接直した写し（transfer.js・qa/*.mjs・setup.sh）が、いまの main のひな形と同じか。
      # 古いゲームから写した新作が、ひな形の直しの無いまま公開された（2026-11-07 裁判員のしくみが版9。incidents/2026-11-07-new-game-old-template.md）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          repository: satou-aaaaa/shared-workflows
          ref: main
          path: .shared-workflows
          persist-credentials: false
          sparse-checkout: |
            scripts/sync-template.mjs
            scripts/link-text.mjs
            scripts/game-patterns.mjs
            scripts/check-game-new.mjs
            scripts/game-props.mjs
            scripts/game-lint.mjs
            scripts/game-ja.mjs
            scripts/game-explore.mjs
            template
      # sw.js の SHELL に書いたファイルが全部あるか。1つでも無いと、入れるとき（install）に失敗して電波の無いときに開けない
      # （2026-11-22 Template sync の PR が transfer-qr.js を入れずに SHELL だけ足した。incidents/2026-11-22-template-sync-new-files-left-out.md）
      - name: sw.js の SHELL のファイル
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("sw.js")) process.exit(0);
            const m = fs.readFileSync("sw.js", "utf8").match(/SHELL\s*=\s*(\[[^\]]*\])/);
            if (!m) process.exit(0);
            const miss = JSON.parse(m[1].replace(/\x27/g, "\"")).filter((f) => f !== "./" && !fs.existsSync(f));
            if (miss.length) { console.error("::error::sw.js の SHELL にあるのにファイルが無い: " + miss.join(" ")); process.exit(1); }
            console.log("✓ sw.js の SHELL のファイルが全部ある");'
      # Link check（週1）が調べる .md に、すぐ後ろに全角の字が続く URL が無いか。lychee はそこまで URL と読んで 404 で落ちる。
      # 週1の検査で初めて落ちていた（2026-11-07 rosen-hitofude・seiza-tsunagi。incidents/2026-11-08-link-check-wide-char-after-url.md）
      - name: リンクの書き方
        if: github.event_name == 'pull_request'
        run: node .shared-workflows/scripts/link-text.mjs .
      # 遊ぶ人が困る作り（保存に失敗しても黙る・正解の直後に降りられない・遊び方を Esc で閉じると毎回出る・モードの鍵など）を、
      # この PR で新しく持ち込んだら落とす。もとからあるものは警告だけ（週次まとめで直す）。incidents/2026-11-17-known-game-bugs-spread.md
      - name: 遊ぶ人が困る作り
        if: github.event_name == 'pull_request' && hashFiles('index.html') != ''
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          main_page="$RUNNER_TEMP/main-index.html"
          git show "$BASE:index.html" > "$main_page" 2>/dev/null || rm -f "$main_page"
          node .shared-workflows/scripts/check-game-new.mjs "$main_page" index.html
      # 性質テスト（fast-check）：でたらめな種・日付で問題を何百回も作り、壊れた字・NaN・重なる選び肢・答えが1つでない・
      # 同じ種で中身が変わる、を探す（sandbox の ADR-0011 と同じ考え方）。data.js に make() が無いゲームは飛ばす。
      # 落ちたらログの「再現: FC_SEED=…」で同じ回を手元で回せる。出典 https://fast-check.dev/docs/introduction/why-property-based/
      - name: 問題の作り方の性質テスト
        if: github.event_name == 'pull_request' && hashFiles('data.js') != ''
        env:
          FC_DIR: ${{ runner.temp }}/fc
        run: |
          npm i --no-save --no-audit --no-fund --prefix "$FC_DIR" fast-check@4.10.2 >/dev/null
          node .shared-workflows/scripts/game-props.mjs .
      # 問題文・選び肢・説明の日本語：条文のまま（「三月」＝3か月）・「〜ような」の「の」抜け・二重否定・閉じないかっこ・
      # 正解と両立する選び肢（「取り消せる」と「1年たてば取り消せる」）を探す。✗ は落とし、△（長い文など）は読んで判断（ログに出るだけ）。
      # わざとの例外は qa/ja-allow.txt に理由つき。incidents/2026-11-21-game-ja-unclear.md・routines/game-ja.md
      - name: 問題の日本語
        if: github.event_name == 'pull_request' && (hashFiles('data.js') != '' || hashFiles('gen.js') != '')
        run: node .shared-workflows/scripts/game-ja.mjs --strict .
      # ESLint：書き間違えた変数（no-undef）・届かない行など、遊ぶ前に止まる書き間違いを探す（sandbox の npm run lint と同じ考え方）。
      # 入れはじめなので警告だけ（--warn。PR の画面に注釈が出る）。2026-11-18 に公開中の 190 本で回して指摘は 1 件だった
      - name: ESLint（警告だけ）
        if: github.event_name == 'pull_request' && hashFiles('index.html') != ''
        env:
          LINT_DIR: ${{ runner.temp }}/lint
        run: |
          npm i --no-save --no-audit --no-fund --prefix "$LINT_DIR" eslint@10.14.0 @eslint/js@10.0.1 globals@17.14.0 eslint-plugin-html@8.2.1 >/dev/null
          node .shared-workflows/scripts/game-lint.mjs --warn .
      - name: ひな形の写し
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          added=$(git diff --name-only --diff-filter=A "$BASE" HEAD)
          edited=$(git diff --name-only --diff-filter=M "$BASE" HEAD | grep -xE 'transfer(-qr)?\.js|qa/(a11y|transfer-check|sw-check|core-check)\.mjs|scripts/setup\.sh' || true)
          list=$(printf '%s\n%s\n' "$added" "$edited" | grep . | paste -sd, - || true)
          status=0
          if [ -n "$list" ]; then node .shared-workflows/scripts/sync-template.mjs --check --only="$list" . || status=$?; fi
          rm -rf .shared-workflows
          if [ "$status" != 0 ]; then echo "::error::写しがひな形とちがう。shared-workflows のルートで node scripts/sync-template.mjs ../<ゲーム> を回して写す（ゲームの写しは直さない）"; exit 1; fi
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ inputs.npm_dir }}
      # Playwright が apt で入れる字など（約22MB の .deb）を取っておき、次からはそれを使う。
      # 2026-11-11 に Ubuntu の置き場（archive.ubuntu.com など）の名前が引けず、入れる段階で QA が全部落ちた（incidents/2026-11-11-qa-apt-dns-outage.md）
      - name: apt の取り置きの名前
        id: apt-key
        # Playwright の版が変わると要る部品も変わりうるので、package-lock.json も鍵に入れる
        env:
          LOCK_HASH: ${{ hashFiles(format('{0}/package-lock.json', inputs.npm_dir)) }}
        run: echo "key=qa-apt-$ImageOS-$ImageVersion-$LOCK_HASH" >> "$GITHUB_OUTPUT"
      - name: apt の取り置きを戻す
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qa-apt
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: qa-apt-
      - name: Playwright を入れる
        working-directory: ${{ inputs.npm_dir }}
        env:
          APT_KEEP: ${{ runner.temp }}/qa-apt
        run: |
          # 取り置きがあれば、apt を通さず先に dpkg で入れる（apt の索引が古くても版がずれない）
          kept=0
          if compgen -G "$APT_KEEP/*.deb" >/dev/null; then
            # --auto-deconfigure：dpkg は名前の順に入れるので、新しい libasound2-data が入れ済みの古い libasound2t64 を
            # Breaks で断り、半端に入った状態で apt まで止まった（incidents/2026-11-27-qa-apt-keep-breaks-order.md）
            if sudo dpkg -i --skip-same-version --auto-deconfigure "$APT_KEEP"/*.deb; then kept=1; else
              echo "::warning::apt の取り置きを入れられなかった。半端に入った部品を apt で直してから、ふだんどおり入れる"
              timeout 5m sudo apt-get -f install -y || echo "::warning::apt -f install も失敗した（このあとの Playwright を入れる段で分かる）"
            fi
          fi
          # apt が名前を引けないと1件ごとに待ち、時間切れまで止まる（2026-11-11 は20分で取り消し）。10分で打ち切る（ふだんは約1分、遅い日で9分）
          if ! timeout 10m npx playwright install --with-deps chromium; then
            # apt に届かなくても、取り置きで部品がそろっていればブラウザだけ入れて続ける（足りなければ検査で起動に失敗して分かる）
            if [ "$kept" = 1 ] && npx playwright install chromium; then
              echo "::warning::Ubuntu の置き場に届かなかったので、apt の取り置きの部品で続けた（incidents/2026-11-11-qa-apt-dns-outage.md）"
            else
              echo "::error::Playwright を入れられなかった。ログに Temporary failure resolving 〜ubuntu.com が並ぶなら GitHub の機械から Ubuntu の置き場が引けていない（コードのせいではない）。しばらくして Re-run する（incidents/2026-11-11-qa-apt-dns-outage.md）"
              exit 1
            fi
          fi
          # 今回 apt が落とした .deb を取り置きに足す。同じ名前の古い版は消す（dpkg -i で版が混ざらないように）
          mkdir -p "$APT_KEEP"
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            name=$(dpkg-deb -f "$f" Package)
            find "$APT_KEEP" -name "${name}_*.deb" -delete
            cp "$f" "$APT_KEEP"/
          done
          echo "apt の取り置き: $(find "$APT_KEEP" -name '*.deb' | wc -l) 個"
      - name: apt の取り置きをしまう
        if: steps.apt-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qa-apt
          key: ${{ steps.apt-key.outputs.key }}
      - name: 検査
        env:
          QA_COMMAND: ${{ inputs.command }}
        # 空白で区切って1つのコマンドとして動かす（シェルの式は通さない）
        run: |
          read -r -a cmd <<<"$QA_COMMAND"
          "${cmd[@]}"
      - name: 直した不具合の再現（qa/repro）
        # game-explore.mjs が見つけて直した不具合の手順をもう一度動かす。まだ壊れていれば落ちる（無ければ飛ばす）
        if: github.event_name == 'pull_request' && hashFiles('qa/repro/*.json') != ''
        run: node .shared-workflows/scripts/game-explore.mjs . --replay qa/repro
      - if: always()
        # 中身は見返す用の控え。GitHub の置き場が時間切れ（ETIMEDOUT）でも、通った QA を赤にしない（2026-11-22 医療費いくら。incidents/2026-11-22-qa-flaky-coach-and-upload.md）
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-report
          path: qa-report/
          if-no-files-found: ignore
