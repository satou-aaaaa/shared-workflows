name: Game QA (共通部品)

# ゲームの QA：ブラウザで自動で遊んで確かめる（Claude は使わない）。各ゲームの .github/workflows/qa.yml が @main で呼ぶ。
# 前は各ゲームが手順を写していて、版の固定（SHA）や時間切れの直しが届かないゲームが出た（incidents/2026-11-07-game-template-review-gaps.md）。
# 検査の名前（check run）は「呼ぶ側のジョブ名 / qa」。ひな形では qa / qa（Auto merge の require_checks とルールセットの必須チェックに書く）。
# 落ちたら成果物の qa-report/report.md を見る。手元では node qa/run.mjs で同じものが回る。
on:
  workflow_call:
    inputs:
      npm_dir:
        description: 'package-lock.json のあるフォルダ'
        type: string
        default: qa
      command:
        description: '検査のコマンド（空白区切りの1つのコマンド）'
        type: string
        default: node qa/run.mjs
      timeout:
        description: '時間切れ（分）。Playwright を入れる段階だけで9分かかる日がある（incidents/2026-11-05-qa-timeout-slow-install.md）'
        type: number
        default: 20

permissions:
  contents: read

jobs:
  qa:
    name: qa
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ inputs.npm_dir }}/package-lock.json
      # PR で足した写し（新作の PR #1 は全部）と、直接直した写し（transfer.js・qa/*.mjs・setup.sh）が、いまの main のひな形と同じか。
      # 古いゲームから写した新作が、ひな形の直しの無いまま公開された（2026-11-07 裁判員のしくみが版9。incidents/2026-11-07-new-game-old-template.md）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          repository: satou-aaaaa/shared-workflows
          ref: main
          path: .shared-workflows
          persist-credentials: false
          sparse-checkout: |
            scripts/sync-template.mjs
            scripts/link-text.mjs
            template
      # Link check（週1）が調べる .md に、すぐ後ろに全角の字が続く URL が無いか。lychee はそこまで URL と読んで 404 で落ちる。
      # 週1の検査で初めて落ちていた（2026-11-07 rosen-hitofude・seiza-tsunagi。incidents/2026-11-08-link-check-wide-char-after-url.md）
      - name: リンクの書き方
        if: github.event_name == 'pull_request'
        run: node .shared-workflows/scripts/link-text.mjs .
      - name: ひな形の写し
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          added=$(git diff --name-only --diff-filter=A "$BASE" HEAD)
          edited=$(git diff --name-only --diff-filter=M "$BASE" HEAD | grep -xE 'transfer\.js|qa/(a11y|transfer-check|sw-check)\.mjs|scripts/setup\.sh' || true)
          list=$(printf '%s\n%s\n' "$added" "$edited" | grep . | paste -sd, - || true)
          status=0
          if [ -n "$list" ]; then node .shared-workflows/scripts/sync-template.mjs --check --only="$list" . || status=$?; fi
          rm -rf .shared-workflows
          if [ "$status" != 0 ]; then echo "::error::写しがひな形とちがう。shared-workflows のルートで node scripts/sync-template.mjs ../<ゲーム> を回して写す（ゲームの写しは直さない）"; exit 1; fi
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ inputs.npm_dir }}
      # Playwright が apt で入れる字など（約22MB の .deb）を取っておき、次からはそれを使う。
      # 2026-11-11 に Ubuntu の置き場（archive.ubuntu.com など）の名前が引けず、入れる段階で QA が全部落ちた（incidents/2026-11-11-qa-apt-dns-outage.md）
      - name: apt の取り置きの名前
        id: apt-key
        # Playwright の版が変わると要る部品も変わりうるので、package-lock.json も鍵に入れる
        env:
          LOCK_HASH: ${{ hashFiles(format('{0}/package-lock.json', inputs.npm_dir)) }}
        run: echo "key=qa-apt-$ImageOS-$ImageVersion-$LOCK_HASH" >> "$GITHUB_OUTPUT"
      - name: apt の取り置きを戻す
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qa-apt
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: qa-apt-
      - name: Playwright を入れる
        working-directory: ${{ inputs.npm_dir }}
        env:
          APT_KEEP: ${{ runner.temp }}/qa-apt
        run: |
          # 取り置きがあれば、apt を通さず先に dpkg で入れる（apt の索引が古くても版がずれない）
          kept=0
          if compgen -G "$APT_KEEP/*.deb" >/dev/null; then
            if sudo dpkg -i --skip-same-version "$APT_KEEP"/*.deb; then kept=1; else echo "::warning::apt の取り置きを入れられなかった。ふだんどおり apt で入れる"; fi
          fi
          # apt が名前を引けないと1件ごとに待ち、時間切れまで止まる（2026-11-11 は20分で取り消し）。10分で打ち切る（ふだんは約1分、遅い日で9分）
          if ! timeout 10m npx playwright install --with-deps chromium; then
            # apt に届かなくても、取り置きで部品がそろっていればブラウザだけ入れて続ける（足りなければ検査で起動に失敗して分かる）
            if [ "$kept" = 1 ] && npx playwright install chromium; then
              echo "::warning::Ubuntu の置き場に届かなかったので、apt の取り置きの部品で続けた（incidents/2026-11-11-qa-apt-dns-outage.md）"
            else
              echo "::error::Playwright を入れられなかった。ログに Temporary failure resolving 〜ubuntu.com が並ぶなら GitHub の機械から Ubuntu の置き場が引けていない（コードのせいではない）。しばらくして Re-run する（incidents/2026-11-11-qa-apt-dns-outage.md）"
              exit 1
            fi
          fi
          # 今回 apt が落とした .deb を取り置きに足す。同じ名前の古い版は消す（dpkg -i で版が混ざらないように）
          mkdir -p "$APT_KEEP"
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            name=$(dpkg-deb -f "$f" Package)
            find "$APT_KEEP" -name "${name}_*.deb" -delete
            cp "$f" "$APT_KEEP"/
          done
          echo "apt の取り置き: $(find "$APT_KEEP" -name '*.deb' | wc -l) 個"
      - name: apt の取り置きをしまう
        if: steps.apt-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qa-apt
          key: ${{ steps.apt-key.outputs.key }}
      - name: 検査
        env:
          QA_COMMAND: ${{ inputs.command }}
        # 空白で区切って1つのコマンドとして動かす（シェルの式は通さない）
        run: |
          read -r -a cmd <<<"$QA_COMMAND"
          "${cmd[@]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-report
          path: qa-report/
          if-no-files-found: ignore
