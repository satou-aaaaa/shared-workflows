<!-- a11y:begin 見やすさの設定 v9（shared-workflows template/a11y/a11y.html の写し。ここでは直さず、ひな形を直して全部のゲームへ写す。drift-check と qa/a11y.mjs が同じ中身か見る） -->
<style id="a11y-css">
/* だれでも：キーボードで選んだ所に太い枠（WCAG 2.4.7・2.4.13） */
:is(button,a,input,select,textarea,summary,[tabindex]):focus-visible{outline:3px solid #1a5fd0!important;outline-offset:2px!important;box-shadow:0 0 0 5px #fff!important}
/* 読みやすい文字：UD フォント・行間 1.7・字間を少し広げる・斜体にしない（BDA Dyslexia Style Guide） */
html.a11y-read body{line-height:1.7}
html.a11y-read body,html.a11y-read body :where(*:not(svg):not(svg *):not([data-a11y-keepfont]):not([data-a11y-keepfont] *)){font-family:"BIZ UDPGothic","BIZ UDGothic","UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif!important;font-style:normal!important}
html.a11y-read :is(p,li,dd,dt,blockquote,[data-a11y-say]){line-height:1.8!important;letter-spacing:.04em!important}
html.a11y-read em,html.a11y-read i:not([aria-hidden]){font-style:normal!important;font-weight:700}
/* 動きを減らす：揺れ・点滅・すべる動きを止める（WCAG 2.3.3。端末の「視差効果を減らす」でも自動で入る） */
html.a11y-calm *,html.a11y-calm *::before,html.a11y-calm *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
/* 色の見分けを助ける：ゲームごとの形・模様は各ゲームが html.a11y-cvd の下に書く。ここではリンクに下線 */
html.a11y-cvd a{text-decoration:underline!important}
/* ふりがな：ゲームが <ruby class="a11y-rb"> を置いた所だけ。選んだときだけ出す */
html:not(.a11y-ruby) ruby.a11y-rb>rt{display:none}
/* 設定の画面（どのゲームでも同じ見た目・同じ濃さ。白地に黒で 15:1） */
.a11y-dlg{max-width:min(420px,calc(100vw - 32px));width:100%;box-sizing:border-box;border:2px solid #1d2320;border-radius:14px;padding:18px 16px 14px;background:#fffdf8;color:#1d2320;font:500 16px/1.6 "BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;letter-spacing:0}
.a11y-dlg::backdrop{background:#0008}
.a11y-dlg:not([open]){display:none}
.a11y-dlg h2{font-size:19px;margin:0 0 4px;font-weight:700;line-height:1.4}
.a11y-dlg p{margin:4px 0 10px;font-size:14px;color:#3d4440;line-height:1.6}
.a11y-dlg label{display:flex;gap:12px;align-items:center;min-height:48px;padding:6px 4px;border-top:1px solid #1d232022;cursor:pointer;line-height:1.4}
.a11y-dlg label small{display:block;font-size:13px;color:#3d4440}
.a11y-dlg input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:#1a5fd0;margin:0}
.a11y-dlg .a11y-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.a11y-dlg button,.a11y-btn,.a11y-saybtn{min-height:44px;min-width:44px;border-radius:10px;border:2px solid #1d2320;background:#fff;color:#1d2320;font:700 15px/1.2 "BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding:0 14px;cursor:pointer;letter-spacing:0}
.a11y-dlg button.a11y-ok{background:#1d2320;color:#fff}
.a11y-btn.a11y-float{position:fixed;left:max(8px,env(safe-area-inset-left,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:2147483000}
.a11y-btn.a11y-float[hidden]{display:none!important}
/* 「Aa」が出ているあいだは、いちばん下の物が「Aa」の下に隠れたままにならないよう下をあける（WCAG 2.4.11） */
html.a11y-floaton body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))!important}
/* 読み上げボタンが、いちばん下のボタン・リンクにかぶらないよう下をあける */
html.a11y-say body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))!important}
.a11y-saybtn{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:2147483000;box-shadow:0 2px 8px #0003}
.a11y-saybtn[hidden],.a11y-dlg [hidden]{display:none!important}
.a11y-note{font-size:13px!important}
/* 選ぶ行（文字の大きさ・音など。v9）：横に並ぶ大きなボタン。選んだものは濃く */
.a11y-dlg fieldset{border:0;border-top:1px solid #1d232022;margin:0;padding:8px 4px 10px;min-width:0}
.a11y-dlg legend{padding:6px 0 4px;float:left;width:100%;line-height:1.4}
.a11y-dlg legend small{display:block;font-size:13px;color:#3d4440}
.a11y-dlg .a11y-opts{clear:both;display:flex;gap:6px}
.a11y-dlg .a11y-opts label{flex:1;border:2px solid #1d2320;border-radius:10px;min-height:44px;padding:0 6px;justify-content:center;gap:6px;font-weight:700}
.a11y-dlg .a11y-opts label:has(input:checked){background:#1d2320;color:#fff}
.a11y-dlg .a11y-opts label:focus-within{outline:3px solid #1a5fd0;outline-offset:2px}
.a11y-dlg .a11y-opts input{width:18px;height:18px;margin:0;accent-color:#1a5fd0;flex:none}
</style>
<script id="a11y-script">
/* 見やすさの設定（色覚・ディスレクシア・弱視・動きに弱い人のため）。外へは何も送らない。
   設定は localStorage の a11y-v1 に置く。同じサイト（satou-aaaaa.github.io）のゲームは同じ設定を使う。
   ゲームの側でできること：
   - 設定を開くボタンに data-a11y-open を付ける（画面に見えている入口が無いあいだだけ、左下に「Aa」のボタンを出す）
   - 読み上げる文に data-a11y-say を付ける（問題文・知らせなど）
   - 色の見分けを助ける形・模様は html.a11y-cvd の下に CSS で書く。JS では A11y.on('cvd')
   - 揺れ・すべる動きを JS で動かすときは、A11y.on('calm') なら止める
   - 設定が変わると document に a11ychange が届く
   - 設定の印は html の class「a11y-<設定の名前>」（a11y-read など）。部品の class はこれと重ならない名前にする（2026-11-05 a11y-say がボタンとぶつかった）
   v9（2026-11-26）：選ぶ行（CHOICES）を足した。いまは「文字の大きさ」（小・中・大。全ゲーム共通）と「音」（なし・小・ふつう。音のあるゲームだけ出る）と「長く遊んだら知らせる」（kiroku のあるゲームだけ出る）。
   - 文字の大きさは html の class a11y-fs1〜3。ゲームが自分で html.a11y-fs1〜3 の大きさを CSS に書いていればそれを使い、
     書いていなければ html の文字の大きさを 0.9 倍・1.2 倍にする（rem で書いた所が大きくなる。WCAG 1.4.4・Game Accessibility Guidelines「文字の大きさを変えられる」）。
     前のゲームごとの設定（〇〇-fs）は A11y.fsFrom("〇〇-fs", 既定の値) で引き継ぐ（共通の設定をまだ選んでいなければ、その値を使う）
   - 音は Web Audio の出口（AudioContext の destination）に音量のつまみを1つはさむので、ゲームの側は何もしなくてよい
     （WCAG 1.4.2 Audio Control・Xbox Accessibility Guideline 105）。音量は A11y.get("vol")（0 なし・1 小・2 ふつう）
   - 選ぶ行を足すときは CHOICES に1行足す（名前・見出し・説明・選択肢・既定の値・出す条件） */
(() => {
  const KEY = "a11y-v1";
  const root = document.documentElement;
  const OPTS = [
    ["read", "読みやすい文字", "UD フォント・行間と字間を広く"],
    ["cvd", "色の見分けを助ける", "色に形・模様・記号を足す"],
    ["calm", "動きを減らす", "揺れ・点滅・すべる動きを止める"],
    ["say", "読み上げのボタンを出す", "問題や知らせを声で読む（端末の中の声だけ）"],
    ["ruby", "ふりがなを出す", "むずかしい漢字に読みを付ける"],
  ];
  // 選ぶ行：[名前, 見出し, 説明, [[値, 字], …], 既定の値, 出す条件（無ければいつも）]
  const CHOICES = [
    ["fs", "文字の大きさ", "画面の文字を小さく・大きく", [[1, "小"], [2, "中"], [3, "大"]], 2],
    ["vol", "音", "効果音の大きさ", [[0, "なし"], [1, "小"], [2, "ふつう"]], 2, () => hasSound()],
    // 長く遊んだら知らせる（分。0 は知らせない）。数えて知らせるのは共通部品 kiroku（template/kiroku/kiroku.js）。60 分は厚生労働省「情報機器作業における労働衛生管理のためのガイドライン」
    ["rest", "長く遊んだら知らせる", "続けて遊んだ時間で、ひと休みをすすめる", [[0, "知らせない"], [30, "30分"], [60, "60分"], [90, "90分"]], 60, () => !!window.Kiroku],
  ];
  const CH = Object.fromEntries(CHOICES.map((c) => [c[0], c]));
  const media = (q) => { try { return matchMedia(q).matches; } catch { return false; } };
  // 保存した値がオブジェクトでなければ（別のページが書いた・手で直した）無かったことにする（2026-11-05 CodeRabbit：true が入ると設定が開けなくなる）
  const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); return v && typeof v === "object" && !Array.isArray(v) ? v : {}; } catch { return {}; } };
  let S = load();
  // 保存できなかった変更（開いているあいだだけ覚える）。書く前に読み直した値で、まだ保存できていない変更を上書きしない（v7、nenkin-shikumi #1 の CodeRabbit）
  let unsaved = {};
  // 決めていないものは端末の設定に合わせる（視差効果を減らす → 動きを減らす）
  const on = (k) => (k in S ? !!S[k] : k === "calm" ? media("(prefers-reduced-motion: reduce)") : false);
  // 選ぶ行の今の値（選択肢にない値・壊れた値は既定の値）
  const get = (k) => { const c = CH[k]; if (!c) return on(k); const v = S[k]; return c[3].some(([x]) => x === v) ? v : k === "fs" ? oldFs() : c[4]; };
  // 前のゲームごとの文字の大きさ（1〜3）を引き継ぐ。共通の設定をまだ選んでいなければ、その値（無ければゲームの既定の値）を使う
  let fsKey = null, fsDef = 2;
  const oldFs = () => { if (fsKey) { try { const v = +localStorage.getItem(fsKey); if (v >= 1 && v <= 3) return v; } catch { /* 読めない */ } } return fsDef; };
  const fs = () => get("fs");
  // ゲームから一度だけ：A11y.fsFrom("〇〇-fs", 既定の値)。前のキーを覚えて、今の大きさを効かせ、その値を返す
  const fsFrom = (k, d) => { fsKey = k || null; fsDef = d === 1 || d === 3 ? d : 2; applyFs(); return fs(); };

  // ---- 文字の大きさ ----
  const FS_RATE = { 1: 0.9, 2: 1, 3: 1.2 };
  // ゲームが自分で html.a11y-fs1〜3 の大きさを書いているか（書いていればこちらは倍にしない）
  const ownFs = () => [...document.querySelectorAll("style:not(#a11y-css)")].some((t) => t.textContent.includes(".a11y-fs"));
  const applyFs = () => {
    const v = fs();
    for (const n of [1, 2, 3]) root.classList.toggle("a11y-fs" + n, n === v);
    if (root.dataset.a11yFs) { root.style.removeProperty("font-size"); delete root.dataset.a11yFs; }
    if (v === 2 || ownFs()) return;
    const base = parseFloat(getComputedStyle(root).fontSize) || 16;
    root.style.setProperty("font-size", Math.round(base * FS_RATE[v] * 100) / 100 + "px");
    root.dataset.a11yFs = String(v);
  };

  // ---- 音 ----
  // Web Audio の出口に音量のつまみ（GainNode）を1つはさむ。ゲームが ctx.destination へつなぐと、つまみを通って鳴る
  const VOL = [0, 0.35, 1];
  const ctxs = [];
  const level = () => VOL[get("vol")];
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const proto = AC && (window.BaseAudioContext ? BaseAudioContext.prototype : AC.prototype);
    const d = proto && Object.getOwnPropertyDescriptor(proto, "destination");
    if (d && d.get && d.configurable) {
      Object.defineProperty(proto, "destination", { configurable: true, enumerable: d.enumerable, get() {
        const real = d.get.call(this);
        if (!(this instanceof AC)) return real; // 音を書き出すだけの OfflineAudioContext は変えない
        let e = ctxs.find((x) => x.c === this);
        if (!e) { const g = this.createGain(); g.gain.value = level(); g.connect(real); e = { c: this, g }; ctxs.push(e); }
        return e.g;
      } });
    }
  } catch { /* Web Audio の無い端末 */ }
  // <audio>・<video> は「なし」のとき消音にする
  const applyVol = () => {
    const v = level();
    for (const e of ctxs) { try { e.g.gain.cancelScheduledValues(0); } catch { /* 古い端末 */ } e.g.gain.value = v; } // 止まっている AudioContext でもすぐ効くよう値を直に入れる
    for (const m of document.querySelectorAll("audio,video")) m.muted = v === 0;
  };
  // 音を使うページか（Web Audio・<audio>・<video> を使っている）。音の無いゲームでは「音」の行を出さない
  const hasSound = () => ctxs.length > 0 || !!document.querySelector("audio,video") ||
    [...document.scripts].some((t) => t.id !== "a11y-script" && /AudioContext|new Audio\(/.test(t.textContent));
  let fontLoaded = false;
  const loadFont = () => {
    if (fontLoaded) return; fontLoaded = true;
    // Google Fonts を許しているページだけ取りに行く（許していなければ端末にある UD フォントを使う）
    const csp = (document.querySelector('meta[http-equiv="Content-Security-Policy"]') || {}).content || "";
    if (csp && !/fonts\.googleapis\.com/.test(csp)) return;
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap";
    document.head.appendChild(l);
  };
  const apply = () => {
    for (const [k] of OPTS) root.classList.toggle("a11y-" + k, on(k));
    applyFs(); applyVol();
    if (on("read")) loadFont();
    if (sayBtn) sayBtn.hidden = !on("say");
    if (!on("say")) stop();
  };
  const set = (k, v) => {
    unsaved[k] = CH[k] ? v : !!v;
    S = { ...S, ...load(), ...unsaved }; // 別のタブで変えた設定を消さないよう、書く前に読み直す（保存できていない変更はこちらを残す）
    try { localStorage.setItem(KEY, JSON.stringify(S)); unsaved = {}; } catch { /* 保存できなくても今の画面には効かせる */ }
    apply();
    document.dispatchEvent(new CustomEvent("a11ychange", { detail: CH[k] ? { key: k, on: !!v, value: get(k) } : { key: k, on: !!v } }));
  };

  // 読み上げ：端末の中の日本語の声だけを使う（外へ文字を送る声は使わない）
  const voice = () => { try { return speechSynthesis.getVoices().find((v) => /^ja/i.test(v.lang) && v.localService) || null; } catch { return null; } };
  const stop = () => { try { speechSynthesis.cancel(); } catch { /* 無い端末 */ } };
  const visible = (el) => { const r = el.getBoundingClientRect(); const cs = getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.visibility !== "hidden" && !el.closest("[hidden],[aria-hidden=true],[inert]"); };
  const textOf = (sel) => [...document.querySelectorAll(sel)].filter(visible).map((el) => (el.getAttribute("aria-label") || el.innerText || "").trim()).filter(Boolean).join("。");
  // data-a11y-say が無い画面では、見出しと知らせの場所を読む（2026-11-05 何も読まれず設定が開くだけだった）
  const sayText = () => textOf("[data-a11y-say]") || textOf("h1,h2,[role=status],[aria-live]");
  const say = (text) => {
    const v = voice();
    if (!v || !text) return false;
    stop();
    const u = new SpeechSynthesisUtterance(text.slice(0, 600));
    u.voice = v; u.lang = v.lang; u.rate = 0.95;
    speechSynthesis.speak(u);
    return true;
  };

  let dlg = null, sayBtn = null, lastFocus = null;
  const build = () => {
    dlg = document.createElement("dialog");
    dlg.className = "a11y-dlg";
    dlg.setAttribute("aria-labelledby", "a11y-h");
    const hasRuby = !!document.querySelector("ruby.a11y-rb");
    dlg.innerHTML = `<h2 id="a11y-h">見やすさ・読みやすさ</h2><p>ほかのゲームにも同じ設定が使われます。</p>` +
      CHOICES.map(([k, n, d, opts]) => `<fieldset data-c="${k}"><legend>${n}<small>${d}</small></legend><div class="a11y-opts">` +
        opts.map(([v, t]) => `<label><input type="radio" name="a11y-${k}" data-c="${k}" value="${v}">${t}</label>`).join("") + `</div></fieldset>`).join("") +
      OPTS.filter(([k]) => k !== "ruby" || hasRuby).map(([k, n, d]) => `<label><input type="checkbox" data-k="${k}"><span>${n}<small>${d}</small></span></label>`).join("") +
      `<p class="a11y-note" id="a11y-novoice" hidden>この端末には、外へ送らずに読める日本語の声がありません。</p><div class="a11y-row"><button type="button" class="a11y-ok" data-a11y-close>閉じる</button></div>`;
    document.body.appendChild(dlg);
    dlg.addEventListener("change", (e) => {
      const c = e.target.dataset && e.target.dataset.c;
      if (c) return set(c, +e.target.value);
      const k = e.target.dataset && e.target.dataset.k;
      if (!k) return;
      set(k, e.target.checked);
      if (k === "say") dlg.querySelector("#a11y-novoice").hidden = !(e.target.checked && !voice());
    });
    // dialog を知らないブラウザでは close が無いので、open を外して閉じ、フォーカスを戻す（v6。jitensha-rule #1・sekai-jikoku #1 の CodeRabbit）
    dlg.querySelector("[data-a11y-close]").addEventListener("click", () => { if (dlg.close) dlg.close(); else { dlg.removeAttribute("open"); if (lastFocus && lastFocus.focus) lastFocus.focus(); } });
    dlg.addEventListener("close", () => { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
    sayBtn = document.createElement("button");
    sayBtn.type = "button"; sayBtn.className = "a11y-saybtn"; sayBtn.textContent = "🔊 読む"; sayBtn.setAttribute("aria-label", "画面の問題を読み上げる");
    sayBtn.addEventListener("click", () => {
      try { if (speechSynthesis.speaking) return stop(); } catch { /* 無い端末 */ }
      if (!say(sayText())) open();
    });
    document.body.appendChild(sayBtn);
    // 左下の「Aa」は、画面に見えている入口（data-a11y-open）がほかに無いときだけ出す。
    // ゲームの多くはホームのフッターを JS で後から描くので、作った時だけ見ると入口があっても出て、統計の上に重なっていた
    // （v8。2026-11-22 169本。WCAG 2.4.11 Focus Not Obscured・3.2.4 Consistent Identification。incidents/2026-11-22-a11y-float-over-home.md）
    const float = document.createElement("button");
    float.type = "button"; float.className = "a11y-btn a11y-float"; float.textContent = "Aa"; float.setAttribute("data-a11y-open", ""); float.setAttribute("aria-label", "見やすさの設定");
    float.hidden = true;
    document.body.appendChild(float);
    const seen = (e) => e !== float && e.getClientRects().length > 0 && !e.closest("[hidden],dialog:not([open])");
    let queued = false;
    const place = () => {
      queued = false;
      const need = ![...document.querySelectorAll("[data-a11y-open]")].some(seen);
      if (float.hidden === need) float.hidden = !need;
      document.documentElement.classList.toggle("a11y-floaton", need);
    };
    const later = () => { if (!queued) { queued = true; requestAnimationFrame(place); } };
    new MutationObserver(later).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden", "class", "style", "open"] });
    place();
    document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest("[data-a11y-open]"); if (t) { e.preventDefault(); open(); } });
    apply();
  };
  const open = () => {
    if (!dlg) build();
    lastFocus = document.activeElement;
    for (const c of dlg.querySelectorAll("input[data-k]")) c.checked = on(c.dataset.k);
    for (const c of dlg.querySelectorAll("input[data-c]")) c.checked = +c.value === get(c.dataset.c);
    for (const [k, , , , , show] of CHOICES) dlg.querySelector(`fieldset[data-c="${k}"]`).hidden = !!show && !show();
    dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice());
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  };
  // 声の一覧はあとから届くことがある。届いたら「声がありません」を出し直す
  try { speechSynthesis.addEventListener("voiceschanged", () => { if (dlg) dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice()); }); } catch { /* 無い端末 */ }
  apply();
  // 端末の「視差効果を減らす」を開いたあとに変えても効かせる（自分で決めていないときだけ。v7、hatsuden-kurabe #1 の CodeRabbit）
  try {
    const mq = matchMedia("(prefers-reduced-motion: reduce)");
    // 設定の画面を開いたままでも、チェックを今の状態に合わせる（合わないと1回目の押しで外せない）
    const follow = () => { if (!("calm" in S)) { apply(); const c = dlg && dlg.querySelector('input[data-k="calm"]'); if (c) c.checked = on("calm"); document.dispatchEvent(new CustomEvent("a11ychange", { detail: { key: "calm", on: on("calm") } })); } };
    if (mq.addEventListener) mq.addEventListener("change", follow); else if (mq.addListener) mq.addListener(follow);
  } catch { /* matchMedia の無い端末 */ }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
  // 別のタブ・別のゲームで設定を変えたら、こちらにも効かせる
  addEventListener("storage", (e) => { if (e.key === KEY) { S = { ...load(), ...unsaved }; apply(); } });
  window.A11y = { on, get, set, fs, fsFrom, open, say, stop };
})();
</script>
