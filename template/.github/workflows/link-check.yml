name: Link check

# 公開ページのリンク切れを週1回調べる（Claude は使わない）。中身は共通部品 satou-aaaaa/shared-workflows。
# 失敗すると ci-failure-issue.yml が Issue を立てる（見張り一覧に "Link check" を入れておく）。
on:
  schedule:
    # 毎週水曜 06:37 JST（= 火曜 21:37 UTC）
    - cron: "37 21 * * 2"
  workflow_dispatch:
  # このファイルを変えた PR でも1回動かし、設定の誤り（調べるリンクが0件など）をマージ前に見つける
  pull_request:
    paths:
      - .github/workflows/link-check.yml
  # 直した設定がマージされたら main でも1回動かす。動かさないと main の最新の実行は赤のまま残り、
  # PR の「Closes #N」で閉じた Issue を見回りが開き直す（2026-11-05 incidents/2026-11-05-link-check-not-rerun-on-main.md）
  # 調べるファイル（*.html・README.md）のリンクを直したときも動かす（2026-11-07 kotowaza-bamen #1 の CodeRabbit）
  push:
    branches: [main]
    paths:
      - .github/workflows/link-check.yml
      - "*.html"
      - README.md

permissions:
  contents: read

jobs:
  check:
    uses: satou-aaaaa/shared-workflows/.github/workflows/link-check.yml@main
    with:
      # 調べるリンクが0件だと落ちる（lychee の failIfEmpty）。画面を JS で作るアプリや、README だけの main でも0件にならないよう README.md も調べる（AGENTS.md などは全角かっこの続きまで URL と読まれて落ちるので入れない）
      # （2026-11-04 incidents/2026-11-04-link-check-readme-only-main.md）
      files: '*.html README.md'
      # 自分たちの公開ページ（*.github.io）は各リポジトリの site-watch が毎日見張る。初めて公開する前の PR では 404 になるので、ここでは調べない
      exclude: '^https://satou-aaaaa\.github\.io/'
