name: QA

# ゲームの QA：ブラウザで自動で遊んで確かめる（Claude は使わない）。新しいゲームはこれを写す。
# 落ちたら qa-report/report.md を見る。手元では node qa/run.mjs で同じものが回る。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: qa
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Playwright を入れる段階だけで9分かかる日がある（incidents/2026-11-05-qa-timeout-slow-install.md）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: qa
      - run: npx playwright install --with-deps chromium
        working-directory: qa
      - run: node qa/run.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-report
          path: qa-report/
          if-no-files-found: ignore
