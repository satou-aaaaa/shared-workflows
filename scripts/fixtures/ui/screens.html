<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>画面を分けた見本</title>
<script src="/template/core/core.js"></script>
<style>body{font:16px sans-serif;margin:16px}a,button{display:inline-block;min-width:44px;min-height:44px}section{display:block}summary{min-height:44px}</style></head>
<body>
<!-- ui-check と check-screens の試運転に使う。?bad で、記録の画面に見出しを7つ・畳みの入れ子を足す -->
<section data-screen="home">
  <h1>見本</h1>
  <p>1行の説明。</p>
  <button>今日の1問</button>
  <nav aria-label="画面"><a href="#kiroku">記録</a> <a href="#chou">帳</a> <a href="#about">このゲームについて</a></nav>
</section>
<section data-screen="kiroku" data-title="記録" hidden><h2>記録</h2><p>遊んだ日 3日</p><a href="#">ホームへ</a></section>
<section data-screen="chou" data-title="帳" hidden><h2>帳</h2><p>集めたもの</p><a href="#">ホームへ</a></section>
<section data-screen="about" data-title="このゲームについて" hidden><h2>このゲームについて</h2><details><summary>出典</summary><p>出典の一覧</p></details><a href="#">ホームへ</a></section>
<footer><a href="#about">このゲームについて</a></footer>
<script>
if (location.search.includes('bad')) {
  const k = document.querySelector('[data-screen="kiroku"]');
  for (let i = 0; i < 6; i++) { const h = document.createElement('h2'); h.textContent = '見出し' + i; k.append(h); }
  const d = document.createElement('details'); d.innerHTML = '<summary>外</summary><details open><summary>中</summary><p>中の中</p></details>'; d.open = true; k.append(d);
}
</script>
</body></html>
